name: CI

# Two triggers on purpose, and the `push` leg is the load-bearing one. A `pull_request` run is
# built against `refs/pull/N/merge`, the merge commit GitHub precomputes - so when a PR has a
# merge CONFLICT with its base, that ref cannot exist, GitHub creates no run at all, and the
# branch silently stops being tested with no failure anywhere to notice. That is not
# hypothetical: `main` landed its own ISL29125 promotion on 2026-09-14, which conflicted with
# `claude/automated-build-chain-nuzumw`, and 128 commits then went unverified because
# `push` was scoped to `main` alone and nothing else covered the branch. Same failure class as
# the `paths:`-filtered second workflow file the web-changes job below explains avoiding
# (SPECIFICATION.md Part H.8): a check that never fires reads exactly like a check that passed.
on:
  pull_request:
  push:
    branches: ['**']  # '**' rather than bare `push:`, so pushing a tag doesn't run the suite again

# Deliberately shared between the two triggers above: `github.head_ref` is the source branch on a
# pull_request and empty on a push, where `github.ref_name` is that same branch name - so a push
# to a branch with an open PR puts both runs in ONE group and `cancel-in-progress` leaves exactly
# one alive. Exactly one, not zero and not two: no doubled spend on this matrix, and a conflicted
# PR still gets the `push` run because it is then the only one that exists. Which of the two
# survives is a race and does not matter - they differ only in whether the tree carries the merge
# commit, and for a conflicted PR there is no merge commit to test in the first place.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Deny-by-default for the automatic GITHUB_TOKEN: without this block every job inherits whatever
# the repo/org default is, which is frequently write-scoped. No job here pushes, comments, or
# calls the API - the codecov steps upload over their own token and are continue-on-error - so
# `contents: read` per job is the whole requirement. Enforced by zizmor's excessive-permissions
# audit (scripts/lint.sh).
permissions: {}

jobs:
  web-changes:
    # Gates the web-CI tier below on whether THIS PUSH touched the website's own source (html/,
    # js/, tests_js/) or its own tooling config. That needs the explicit `base:` below: given none,
    # `dorny/paths-filter` compares a push against the repository's default branch, so on a
    # long-lived branch every push matched whatever it had touched weeks ago and the whole web tier
    # ran on markdown-only commits (BACKLOG item 36). Kept as a single workflow file with a
    # changes-detection job feeding `if:` conditions, deliberately not a second workflow
    # file with its own trigger-level `paths:` filter (which can leave a PR stuck on a required
    # status check that never fires because the whole workflow never triggered - see
    # SPECIFICATION.md Part H.8). The existing Python jobs below are untouched and keep running on every
    # trigger regardless of this job's result.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # v3
        id: filter
        with:
          # Upstream's own documented idiom for "what did this push change": a base naming the same
          # branch that was pushed to is detected against the commit before the push. Ignored on a
          # pull_request, which is compared through the API against the PR's base - so a PR still
          # runs the full web tier before merge, which is what a pre-merge status check wants.
          base: ${{ github.ref }}
          filters: |
            web:
              - 'html/**'
              - 'js/**'
              - 'tests_js/**'
              - 'mockdata/**'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'eslint.config.js'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - 'vitest.config.js'
              - '.htmlvalidate.json'
              - '.stylelintrc.json'
              - '.nvmrc'

  web-lint-and-typecheck:
    # JS/HTML/CSS equivalent of the Python lint-and-typecheck job below - see SPECIFICATION.md
    # Part H.8 for the role mapping (ESLint~ruff, tsc --noEmit~mypy, html-validate/Stylelint have no direct
    # Python-side counterpart).
    needs: web-changes
    if: needs.web-changes.outputs.web == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: ESLint (js/, tests_js/)
        run: npm run lint
      - name: TypeScript checkJS (tsc --noEmit)
        run: npm run typecheck
      - name: html-validate (html/)
        run: npm run lint:html
      - name: Stylelint (html/)
        run: npm run lint:css

  web-unit-tests:
    # Vitest in real-browser mode (Playwright + Chromium, not jsdom) - see SPECIFICATION.md Part H.8.
    # This CI runner has no pre-installed browser (unlike a Claude Code dev sandbox - see
    # vitest.config.js's own comment), so it installs its own matching
    # Chromium build via `playwright install` before running tests.
    #
    # Also builds the MicroPython Unix-port toolchain (below) - tests_js/live-backend.test.js
    # (SPECIFICATION.md Part H.7) drives a real digital-twin subprocess as part of the Vitest
    # suite, the first thing in this job's history to need it. This does cost this job the same
    # toolchain-build time the Python-side unit-tests job already pays (mitigated the same way:
    # the toolchain-cache step below shares that job's exact cache key, so a normal PR run hits a
    # warm cache here too) - a deliberate tradeoff, not an oversight: see SPECIFICATION.md Part H.7
    # for why the live-backend test needed to actually drive the twin rather than stay
    # mock-server.js-only.
    needs: [web-changes, web-lint-and-typecheck]
    if: needs.web-changes.outputs.web == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Mirrors the Python side's "Cache MicroPython Unix port build" steps below - the browser
      # binary itself is cached across runs (keyed on package-lock.json, which pins the exact
      # playwright version); OS-level dependencies (apt packages headless Chromium needs) are
      # cheap and reinstalled every run regardless, since they aren't part of the cached path -
      # this is Playwright's own documented CI caching pattern.
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Set up MicroPython toolchain (install uv, restore cache)
        uses: ./.github/actions/setup-micropython-toolchain
      - name: Build MicroPython Unix port (if not cached)
        run: |
          bin="$HOME/pico-toolchain/micropython/ports/unix/build-standard/micropython"
          if [ ! -x "$bin" ]; then
            uv run toolchain/setup_toolchain.py setup
          fi
      # The real wozi website is built automatically by npm's own `pretest`/`pretest:coverage`
      # hooks (package.json) - single source of truth for "build before test", shared with local
      # dev (see "Run unit tests" comment above).
      # Everything except tests_js/live-backend-put-matrix.test.js, which is its own sharded job
      # below: measured locally, that one file is 567s of this suite's 578s (243 of its 778 tests),
      # so leaving it here is what put this job under 2x headroom against its own budget.
      - name: Run unit tests (Vitest, real-browser mode)
        run: npm run test:unit

  web-put-matrix:
    # The live PUT matrix (tests_js/live-backend-put-matrix.test.js): every writable wozi.json field
    # driven through a real browser against a real digital twin. Split out of web-unit-tests and
    # sharded because it IS the web tier's wall clock - measured locally, 567s of the suite's 578s,
    # 243 of its 778 tests - so it repeatedly rolled a 20-minute budget and took the other 535
    # tests' signal, the coverage report and the cross-browser smoke down with it (BACKLOG item 36).
    # Each shard is its own runner, so the harness's fixed twin port (tests_js/_live_matrix_command.js)
    # never collides; the partition itself is proven by tests_js/mock-server-put-matrix.test.js.
    #
    # needs: web-unit-tests rather than web-lint-and-typecheck, the same fail-fast reasoning
    # web-cross-browser-smoke states for itself - no point spending three runners on the slow
    # matrix if the two-minute suite already found the regression.
    needs: [web-changes, web-unit-tests]
    if: needs.web-changes.outputs.web == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false  # one shard's failure must not hide which cases the other two would have caught
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Set up MicroPython toolchain (install uv, restore cache)
        uses: ./.github/actions/setup-micropython-toolchain
      - name: Build MicroPython Unix port (if not cached)
        run: |
          bin="$HOME/pico-toolchain/micropython/ports/unix/build-standard/micropython"
          if [ ! -x "$bin" ]; then
            uv run toolchain/setup_toolchain.py setup
          fi
      - name: Run the live PUT matrix (shard ${{ matrix.shard }} of 3)
        run: npm run test:put-matrix
        env:
          PUT_MATRIX_SHARD: ${{ matrix.shard }}/3

  # Split out from web-unit-tests (was its last three steps) after this job's own coverage rerun
  # was confirmed to intermittently blow web-unit-tests' 20-minute timeout-minutes budget even
  # though the coverage step itself is continue-on-error: true - `needs:`/timeout-minutes gate on
  # a whole job finishing, not on its "real" step alone, so a slow instrumented rerun (real-browser
  # Playwright + a real digital-twin subprocess boot, same suite run a second time) could still get
  # the entire job - including the already-passed real test step above - killed by the timeout and
  # block the downstream web-cross-browser-smoke job that only actually needs the real test result.
  # Confirmed on this branch's own PR #50 (run `33856690559`, BACKLOG.md's former "HIGH PRIORITY"
  # entry): "Run unit tests (Vitest, real-browser mode)" had already succeeded when the job was
  # killed mid-"Run unit tests with coverage". Coverage is a report, never a gate (CLAUDE.md's
  # "Code quality tooling", SPECIFICATION.md Part E.5) - giving it a wholly separate job with its
  # own timeout budget, gating nothing downstream, is what actually makes that true; before this
  # split, it could still take the real signal down with it purely on wall-clock time.
  web-coverage:
    needs: [web-changes, web-unit-tests]
    if: needs.web-changes.outputs.web == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Set up MicroPython toolchain (install uv, restore cache)
        uses: ./.github/actions/setup-micropython-toolchain
      - name: Build MicroPython Unix port (if not cached)
        run: |
          bin="$HOME/pico-toolchain/micropython/ports/unix/build-standard/micropython"
          if [ ! -x "$bin" ]; then
            uv run toolchain/setup_toolchain.py setup
          fi
      # Coverage is a report, not a gate (mirrors the Python side's own non-gating
      # scripts/test.sh --coverage - see CLAUDE.md's "Code quality tooling", SPECIFICATION.md
      # Part E.5). web-unit-tests' own "Run unit tests" step is the real pass/fail signal; this
      # just re-runs the same suite once more, instrumented, to measure js/ line coverage.
      # Excludes the live PUT matrix for the same reason web-unit-tests does, and at almost no cost
      # to the number: tests_js/mock-server-put-matrix.test.js drives the same js/ paths over the
      # same generated case list, against the mock backend instead of a real twin.
      - name: Run unit tests with coverage
        run: npm run test:coverage 2>&1 | tee coverage-output.txt
        continue-on-error: true
      - name: Add coverage summary to job summary
        if: hashFiles('coverage-output.txt') != ''
        # Quoted heredocs (not `echo '...'`) so the literal markdown backticks need no quoting
        # gymnastics, and one grouped redirect instead of four - both flagged by actionlint's
        # embedded shellcheck (SC2016/SC2129).
        run: |
          {
            cat <<'MD_FENCE_OPEN'
          ### JS coverage (`js/`)
          ```
          MD_FENCE_OPEN
            tail -n 15 coverage-output.txt
            cat <<'MD_FENCE_CLOSE'
          ```
          MD_FENCE_CLOSE
          } >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      - name: Upload HTML coverage report artifact
        if: hashFiles('htmlcov_js/index.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html-js
          path: htmlcov_js/
        continue-on-error: true

  web-cross-browser-smoke:
    # Runs the real production website through three engines Vitest's Playwright-only browser mode
    # can't reach (WebKitGTK, real Firefox, real Microsoft Edge), plus Playwright's own Chromium for
    # a consistent baseline - each at a desktop and a mobile-sized viewport. Deliberately narrow
    # scope: one field edit+apply per (engine, viewport), not the full PUT matrix - see
    # scripts/cross_browser_smoke.mjs's own header comment and SPECIFICATION.md Part H.7
    # ("Cross-browser coverage") for the "Coverage depth"/"Test architecture" decisions behind that.
    #
    # needs: web-unit-tests, not just web-lint-and-typecheck - no reason to spend several more
    # minutes installing three more browser engines if the fast native-Chromium suite already
    # caught a regression (same fail-fast reasoning as digital-twin-e2e's own needs: unit-tests).
    needs: [web-changes, web-unit-tests]
    if: needs.web-changes.outputs.web == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Mirrors web-unit-tests' own identical step (see its comment) - this job's Chromium leg
      # (scripts/cross_browser_smoke.mjs's runChromiumFamily("chromium", ...)) needs Playwright's
      # own browser binary too, and each CI job is its own fresh VM with no browser cache carried
      # over from web-unit-tests even though that job (this one's own `needs:`) already installed
      # it moments earlier in the same workflow run. Confirmed necessary directly: an earlier
      # version of this job omitted this step entirely and both Chromium checks failed in real CI
      # with "Executable doesn't exist" - WebKit/Firefox/Edge all passed correctly in that same run,
      # proving the three new engines were never the problem.
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Set up MicroPython toolchain (install uv, restore cache)
        uses: ./.github/actions/setup-micropython-toolchain
      - name: Build MicroPython Unix port (if not cached) and the real wozi website
        run: |
          bin="$HOME/pico-toolchain/micropython/ports/unix/build-standard/micropython"
          if [ ! -x "$bin" ]; then
            uv run toolchain/setup_toolchain.py setup
          fi
          scripts/build_website.sh wozi
          uv run scripts/_generate_sensortask_modules.py
      # Firefox+geckodriver (via conda-forge/micromamba - see scripts/setup_cross_browser_toolchain.sh's
      # own comment for why) is the one piece of this job's toolchain worth caching across runs: it's
      # a ~106MB download from a channel with no version-pin file to key on (deliberately unpinned,
      # unlike the MicroPython toolchain above), so this just caches "whatever conda-forge currently
      # publishes" under a fixed key - bump the key's trailing version number to force a fresh pull
      # if that ever needs to happen. WebKit (a plain apt package) and Edge (Microsoft's own apt repo)
      # are cheap enough to reinstall every run, matching Playwright Chromium's OS-deps-only-on-cache-
      # hit precedent above.
      - name: Cache Firefox + geckodriver (conda-forge)
        uses: actions/cache@v6
        with:
          path: ~/cross-browser-toolchain
          key: cross-browser-firefox-v1-${{ runner.os }}
      - name: Install WebKit, Edge, and Firefox+geckodriver
        run: scripts/setup_cross_browser_toolchain.sh
      - name: Run cross-browser smoke check
        run: node scripts/cross_browser_smoke.mjs

  lint-and-typecheck:
    # Gates on src/, tests/, digital_twin/, and buildgen/ for ruff, plus
    # tests_hardware/device_scripts/ for mypy only (tests_hardware/device_scripts/
    # is MicroPython-target code, checked by the main mypy pass below alongside src/tests/, not
    # the host build chain's separate pass), plus the whole host-side build chain - buildgen/,
    # scripts/, toolchain/ and tests_scripts/ - under both tools (the build scripts gate the
    # firmware every device ships, so they carry the same bar as the code they build; their mypy
    # coverage comes from host_typecheck.ini's own separate pass). Passing explicit paths to
    # scripts/typecheck.sh overrides pyproject.toml's `files`/default target for that one
    # invocation without changing what a plain `scripts/lint.sh`/`scripts/typecheck.sh` checks
    # locally (still full-scope: see scripts/typecheck.sh's `mypy "$@"` and ruff's own
    # CLI-args-override-config behavior). digital_twin/ and buildgen/ are NOT in the
    # `ruff check`/`scripts/typecheck.sh` args below the way src/tests are - see pyproject.toml's
    # [tool.mypy] exclude comment, digital_twin/typecheck.ini's own docstring, and
    # host_typecheck.ini's own docstring for why mypy needs a wholly separate invocation for each
    # (digital_twin/: bare `machine`/`network`/`neopixel` module names can only resolve one way per
    # mypy run; the host build chain - buildgen/, scripts/, toolchain/, tests_scripts/, plus
    # tests_hardware/'s own host-CPython pytest code: genuinely CPython-target host tooling, needs
    # mypy's real bundled typeshed instead of the MicroPython-stub-replaced one); scripts/typecheck.sh
    # already runs both second passes unconditionally, regardless of "$@", so the Mypy step below
    # gates on both without needing them named here explicitly. Ruff has no such per-run resolution
    # conflict, so every scope is just named directly.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        run: pip install uv
      # Retried here too, not just in the test lanes below: `actionlint-py` ships no wheel and
      # fetches its binary inside its own build backend, so one bad response fails a lane on a tree
      # where nothing is wrong - HTTP 500 on 2026-09-13, 504 on 2026-09-14, on shell-free lanes.
      - name: Sync dev dependencies (retried - third-party build downloads are not always up)
        run: |
          for attempt in 1 2 3; do
              uv sync && exit 0
              echo "uv sync failed on attempt $attempt/3; retrying in $((attempt * 10))s" >&2
              sleep $((attempt * 10))
          done
          uv sync
      - name: Ruff (src/, tests/, digital_twin/, tests_hardware/, and the whole host build chain)
        run: uv run ruff check src tests digital_twin tests_hardware buildgen scripts toolchain tests_scripts
      - name: Mypy (src/, tests/, digital_twin/, tests_hardware/device_scripts/, and the whole host build chain)
        run: uv run scripts/typecheck.sh src tests tests_hardware/device_scripts

  shellcheck:
    # Own stage, not a step inside lint-and-typecheck: each tool gets its own independently
    # red/green check run. scripts/lint.sh still runs all of them together for local use.
    # Covers scripts/ only - the four legacy build-*.sh at the repo root are the same pre-refactor
    # generation as python//modules/ and out of lint scope by that same standing decision (they
    # carry 28 findings of their own, including no shebang at all - see BACKLOG.md).
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        run: pip install uv
      # Retried for the same reason as lint-and-typecheck's own sync above.
      - name: Sync dev dependencies (retried - third-party build downloads are not always up)
        run: |
          for attempt in 1 2 3; do
              uv sync && exit 0
              echo "uv sync failed on attempt $attempt/3; retrying in $((attempt * 10))s" >&2
              sleep $((attempt * 10))
          done
          uv sync
      - name: Shellcheck (scripts/)
        run: uv run shellcheck scripts/*.sh

  actionlint:
    # Checks this workflow and the composite action for expression/context typos that otherwise
    # only surface as a broken CI run. Also runs shellcheck over every `run:` block, which is why
    # shellcheck-py is on PATH here too (both come from the same `uv sync`).
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        run: pip install uv
      # Retried for the same reason as lint-and-typecheck's own sync above.
      - name: Sync dev dependencies (retried - third-party build downloads are not always up)
        run: |
          for attempt in 1 2 3; do
              uv sync && exit 0
              echo "uv sync failed on attempt $attempt/3; retrying in $((attempt * 10))s" >&2
              sleep $((attempt * 10))
          done
          uv sync
      - name: Actionlint (.github/)
        run: uv run actionlint

  zizmor:
    # GitHub Actions security audit - token permissions, checkout credential persistence, action
    # pinning. --offline skips the two audits needing the GitHub API (ref-confusion,
    # impostor-commit) so this behaves identically here, on a dev box, and in CLAUDE.md's clean
    # chroot recipe. Policy config: .github/zizmor.yml.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        run: pip install uv
      # Retried for the same reason as lint-and-typecheck's own sync above.
      - name: Sync dev dependencies (retried - third-party build downloads are not always up)
        run: |
          for attempt in 1 2 3; do
              uv sync && exit 0
              echo "uv sync failed on attempt $attempt/3; retrying in $((attempt * 10))s" >&2
              sleep $((attempt * 10))
          done
          uv sync
      - name: Zizmor (.github/)
        run: uv run zizmor --offline .github/

  unit-tests:
    # Tests run under a real MicroPython Unix-port interpreter, not CPython - see
    # SPECIFICATION.md Part E.
    #
    # needs: lint-and-typecheck - serializes the two jobs in this workflow instead of letting them
    # run in parallel (the previous default). This dates from an earlier phase of the CI-hang
    # investigation, when the leading theory was that concurrent job load on GitHub's shared
    # runners caused the hang; that theory was wrong (see CLAUDE.md's "CI hang investigation" note
    # for the real root cause and fix). Job sequencing didn't fix the hang and isn't required for
    # it, but it's kept anyway - cheap, harmless, and removes one more source of self-inflicted
    # concurrency as a standing precaution, per the project owner's direction that slower is fine
    # but hanging never is.
    #
    # timeout-minutes is a job-level backstop, not the primary defense against hangs -
    # scripts/test.sh itself wraps every individual test file in a per-file timeout (with two
    # retries; see scripts/test.sh's own comment on that and on why it, like this job sequencing,
    # turned out not to be what actually fixed the hang). That inner per-file timeout means any
    # future hang would surface as a fast, attributable failure within minutes instead of silently
    # consuming the whole job; timeout-minutes here only guards against a genuinely pathological
    # run (many files hanging at once) rather than being the only thing standing between a stuck
    # test and GitHub's own 360-minute hard limit (the scenario that produced the originally-
    # observed 6-hour hang before timeout-minutes existed - see CLAUDE.md's "CI hang investigation"
    # note). Real GitHub-hosted-runner timings, measured directly rather than assumed (Session 8's
    # closing-pass PR, two independent cold-cache runs - no prior run on this exact branch/PR scope
    # to inherit a cache from, see SPECIFICATION.md Part L for the mechanism): this job's own plain pass
    # took 16m58s and 16m42s from a cold cache (full from-scratch ARM+MicroPython Unix-port
    # toolchain build included); a warm cache drops that to the ~13-15 minutes the test suite itself
    # takes (~17 minutes measured on a real runner, 2026-09-13). The coverage pass used to run
    # serially in this same job (see unit-tests-coverage below for why it no longer does).
    #
    # 45, not 25/30: scripts/test.sh's per-file timeout is 180s with three attempts, so one
    # genuinely hung file costs up to 9 minutes of retries on top of the ~17-minute warm-cache run -
    # which a tighter cap does not cover once the suite grows at all. This cap is the backstop for
    # many files hanging at once, not for one; sizing it below "normal run + one file's full retry
    # budget" makes it fire on healthy runs instead, which is exactly how run `34755468619` was lost.
    #
    # `if: !cancelled()` keeps the `needs:` edge above (so the serialization the standing backstop
    # asks for is intact) while dropping the SUCCESS gating that `needs:` otherwise implies. That
    # gating was never a deliberate choice - it is a side effect of the sequencing - and it is
    # actively harmful: a red lint job silently SKIPS this job, so a lint finding hides every
    # test result behind it. That is not hypothetical; it is exactly why unit-tests,
    # digital-twin-e2e and firmware-build-verify had never once run on the branch that introduced
    # `select = ["ALL"]`, and it hid that fact for the entire life of that branch. Lint and tests
    # answer different questions; a failure of one must not erase the answer to the other.
    needs: lint-and-typecheck
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up MicroPython toolchain (install uv, restore cache)
        uses: ./.github/actions/setup-micropython-toolchain
      # scripts/test.sh's pytest tier shells out to `uv run`, which implicitly builds the WHOLE
      # dev group before it runs anything - ruff, mypy, shellcheck, zizmor and actionlint-py
      # included, none of which tests_scripts/ needs. actionlint-py has no wheel and downloads its
      # binary from a release URL inside its own build backend, so one bad response there fails the
      # entire test lane on a tree where nothing is wrong: `error: HTTP Error 500` on 2026-09-13,
      # with lint-and-typecheck's identical `uv sync` succeeding 27 seconds earlier in the same
      # run. Doing the sync here, retried, keeps a third party's momentary outage from reading as a
      # red test result - the same "lint must not erase the answer tests give" reasoning as the
      # `if: !cancelled()` above, applied to the dependency build instead of the job graph.
      # `scripts/test.sh`'s own `uv run` then finds the environment current and rebuilds nothing.
      - name: Sync dev dependencies (retried - third-party build downloads are not always up)
        run: |
          for attempt in 1 2 3; do
              uv sync && exit 0
              echo "uv sync failed on attempt $attempt/3; retrying in $((attempt * 10))s" >&2
              sleep $((attempt * 10))
          done
          uv sync
      - name: Run unit tests
        run: scripts/test.sh

  # The (f) stage of CLAUDE.md's memory-safety rule, which had no runner until 2026-09-21: the same
  # suite again with the gc.threshold(32768) the firmware's own boot entry sets, layered on a design
  # that has already passed at MicroPython's reactive -1 in unit-tests above. Both halves are
  # required - "stable on its own, then pushed further from the threshold" - and only the first was
  # ever exercised here, the twin CI being the sole place the shipped value was tested at all.
  # Its own job, not a second step in unit-tests, for the same reason unit-tests-coverage is split
  # out: a second full-suite run must never sit on the critical path of the jobs that follow.
  unit-tests-gc-threshold:
    name: Unit tests (shipped gc.threshold)
    needs: lint-and-typecheck
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up MicroPython toolchain (install uv, restore cache)
        uses: ./.github/actions/setup-micropython-toolchain
      - name: Run unit tests at the shipped gc.threshold
        run: GC_THRESHOLD=32768 scripts/test.sh

  # Split out of unit-tests above (Session 8's closing-consistency-pass PR), exactly as
  # web-coverage was split out of web-unit-tests and for the same reason - which this branch then
  # proved again on the Python side. Coverage is a report, not a gate (CLAUDE.md's "Code quality
  # tooling", SPECIFICATION.md Part E.5, "Coverage") - never lets anything downstream wait on or
  # fail because of it: re-running the whole real-interpreter suite a second time under
  # tests/_coverage_runner.py's sys.settrace wrapper roughly doubled unit-tests' own wall-clock
  # time for a report nothing else reads to make a decision - firmware-build-verify/digital-twin-e2e
  # only ever needed unit-tests' own toolchain-cache population, never this job's own output, so
  # gating either of them behind a coverage run they don't use was pure wasted latency. `needs:
  # unit-tests` (not lint-and-typecheck directly) specifically to reuse the toolchain cache
  # unit-tests' own run just populated, rather than racing it and potentially rebuilding the same
  # toolchain twice in parallel on a cold cache - the one piece of sequencing this job keeps, in
  # exchange for running fully in parallel with firmware-build-verify/digital-twin-e2e instead of
  # blocking them.
  #
  # `timeout-minutes` gates a whole job, not its "real" step, so a slow instrumented rerun kills the
  # already-passed test step with it and skips everything downstream if sized too tight. Measured on
  # run `34755468619`: the plain suite reported "60/60 files passed / ALL PASSED" at 12:07:19, the
  # --coverage rerun then ran 13m24s more and a 30-minute job cap cancelled the lot, taking
  # digital-twin-e2e with it - nothing was wrong with the tree. Session 8's own closing-pass runs
  # (two, against an already-warm cache) measured 14m01s and 16m56s for the full suite re-run under
  # sys.settrace; 45 minutes gives comfortable headroom over both figures and over the incident
  # above alike. Keep the job split even if the suite gets faster again.
  unit-tests-coverage:
    # Success-gated on purpose (no `if: !cancelled()`, unlike unit-tests' own edge above): there is
    # nothing to measure if the plain suite did not pass. Note this job is no longer purely
    # advisory - its own test step gates now, for the reason that step's comment gives.
    needs: unit-tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up MicroPython toolchain (install uv, restore cache)
        uses: ./.github/actions/setup-micropython-toolchain
      # scripts/test.sh's pytest tier shells out to `uv run`, which implicitly builds the WHOLE
      # dev group before it runs anything (see the unit-tests job above for the full account of
      # why this sync is here and retried).
      - name: Sync dev dependencies (retried - third-party build downloads are not always up)
        run: |
          for attempt in 1 2 3; do
              uv sync && exit 0
              echo "uv sync failed on attempt $attempt/3; retrying in $((attempt * 10))s" >&2
              sleep $((attempt * 10))
          done
          uv sync
      # Every report step below is `always() && hashFiles(...)`: the gate and the report are
      # separate signals, so a red test result must not also swallow whatever coverage did render.
      # Re-runs the same suite under build-settrace, wrapped by tests/_coverage_runner.py, to
      # measure src/ AND digital_twin/ line coverage (two reports from one shared run - see
      # scripts/test.sh's own comment). Every step AFTER this one is continue-on-error, because a
      # coverage-tooling failure must never read as a test regression.
      #
      # This step is NOT, and that is the point: build-settrace is the only interpreter variant no
      # other job runs, so a test that fails only under it was invisible while the whole job was
      # advisory - and one really was, on 2026-09-22. Exit 1 is a test failure and goes red; exit 3
      # is "every test passed, only the report failed" and stays advisory (Part E.5.3).
      - name: Run unit tests with coverage (the test result gates, the report does not)
        run: |
          status=0
          scripts/test.sh --coverage || status=$?
          if [ "$status" -eq 3 ]; then
              echo "::warning::coverage rendering failed, but every test passed (exit 3) - report only"
              exit 0
          fi
          exit "$status"
      - name: Add coverage summary to job summary
        if: ${{ always() && hashFiles('coverage_summary.md') != '' }}
        run: cat coverage_summary.md >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      - name: Add digital_twin/ coverage summary to job summary
        if: ${{ always() && hashFiles('coverage_summary_digital_twin.md') != '' }}
        run: cat coverage_summary_digital_twin.md >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      # Free for public repos; needs a CODECOV_TOKEN repo secret (or Codecov's tokenless PR-from-
      # fork support) once this repo is registered at codecov.io - not something CI itself can set
      # up. fail_ci_if_error keeps a missing/invalid token from ever failing the job either way.
      - name: Upload coverage to Codecov
        if: ${{ always() && hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
        continue-on-error: true
      - name: Upload digital_twin/ coverage to Codecov
        if: ${{ always() && hashFiles('coverage_digital_twin.xml') != '' }}
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        with:
          files: coverage_digital_twin.xml
          flags: digital_twin
          fail_ci_if_error: false
        continue-on-error: true
      - name: Upload HTML coverage report artifact
        if: ${{ always() && hashFiles('htmlcov/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: htmlcov/
        continue-on-error: true
      - name: Upload digital_twin/ HTML coverage report artifact
        if: ${{ always() && hashFiles('htmlcov_digital_twin/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html-digital-twin
          path: htmlcov_digital_twin/
        continue-on-error: true


  digital-twin-e2e:
    # Automated version of the digital twin's on-demand manual walkthrough (fresh boot, every GET/
    # PUT endpoint, DebugLevel=5 verbose logging, bus fault injection, settings/error persistence
    # across a real process reboot, soak) - see digital_twin/README.md's "Automated CI suite"
    # section and scripts/run_digital_twin_ci.sh's own header comment for the full reference.
    # Deliberately a separate job from unit-tests above: this drives digital_twin/
    # run_generic_integration.py as a real subprocess over real HTTP through several genuine
    # process restarts (to prove persistence survives an actual reboot, not just an in-process
    # rebuild of the object graph the way tests/test_digital_twin_sensortask_integration.py already
    # does) - a fundamentally different, heavier kind of check than the fast unit-test tier, not a
    # duplicate of it.
    #
    # strategy.matrix over all 6 real devices (SPECIFICATION.md Part L.4, mirroring
    # firmware-build-verify's own precedent below) - each device's own 14-run suite is an
    # independent job, attributable directly in the job list, rather than one long serial script
    # that would otherwise need roughly 6x the wall-clock budget of a single device's run (several
    # runs in the suite each wait tens of seconds for a real state-machine transition - a WiFi
    # hotspot-fallback DNS answer, a soak's own memory-trend sampling - which parallelize for free
    # across jobs but simply sum if serialized in-process). fail-fast: false so one device's
    # failure doesn't cancel the other 5 mid-suite - each is an independent proof.
    #
    # needs: unit-tests - runs after the unit-test tier both for fail-fast ordering (no reason to
    # spend several more minutes on a full boot/reboot/soak cycle if the fast unit tests already
    # caught a regression) and so this job's own toolchain-cache restore, below, can hit the same
    # cache unit-tests' own unix-port-build step just populated.
    needs: unit-tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: [wozi, dev, arzi, klkizi, grkizi, schlafzi]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up MicroPython toolchain (install uv, restore cache)
        uses: ./.github/actions/setup-micropython-toolchain
      - name: Run digital-twin clean/build/test cycle
        run: scripts/run_digital_twin_ci.sh "${{ matrix.device }}"
      - name: Upload digital-twin subprocess logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: digital-twin-ci-logs-${{ matrix.device }}
          path: digital_twin_ci_logs/
          if-no-files-found: ignore
        continue-on-error: true

  firmware-build-verify:
    # The real end-to-end proof for SPECIFICATION.md Part B.11's src/-based build chain: assembles an actual
    # src/-based firmware.uf2 (scripts/build_firmware.py, ext/microdot.py + the real website +
    # every src/ module, frozen and linked against the pinned toolchain) rather than only checking
    # the assembly logic's inputs/outputs in isolation, the way tests_scripts/test_build_firmware.py's
    # fast tests do. This is the "wiring an actual firmware-build stage into CI" gap BACKLOG.md's
    # "No CI firmware-build stage yet" entry describes, closed here for the new src/-based toolchain
    # (that entry itself stays open - it's specifically about the legacy build-*.sh scripts, a
    # separate, not-yet-done piece of work).
    #
    # strategy.matrix over all 6 real devices (SPECIFICATION.md Part L.4) - each is its own
    # job, so a failure names exactly which device's generated build broke directly in the job
    # list, rather than one job silently only ever having covered wozi/dev the way this job did
    # before every device had a buildgen-generated entry point to build from. fail-fast: false so
    # one device's failure doesn't cancel the other 5 mid-build - each is an independent proof.
    #
    # needs: unit-tests, not digital-twin-e2e - this only needs the toolchain cache unit-tests'
    # own setup step already populates (mpy-cross + pico-sdk + picotool + the MicroPython/pico-sdk
    # git checkouts), not anything digital-twin-e2e itself produces, so it runs in parallel with
    # that job instead of serializing after it. The ARM cross-compiler itself (gcc-arm-none-eabi
    # and friends) is a separate apt install, not part of that cached directory - see the
    # dedicated step below for why it still has to run here even on a cache hit.
    #
    # `if: !cancelled()` for the same reason as unit-tests above, and it applies with extra force
    # here: the dependency stated above is a CACHE dependency, not a correctness one, so gating the
    # firmware compile on whether the unit tests passed masks one independent finding behind
    # another. digital-twin-e2e deliberately keeps its own success gating - its `needs:` comment
    # states fail-fast as the actual intent - so it is left alone.
    needs: unit-tests
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        device: [wozi, dev, arzi, klkizi, grkizi, schlafzi]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up MicroPython toolchain (install uv, restore cache)
        uses: ./.github/actions/setup-micropython-toolchain
      # A cache miss here would mean scripts/test.sh itself hasn't run yet on this exact toolchain
      # pin, which shouldn't happen given needs: unit-tests above, but if it does, build_firmware.py's
      # own "no toolchain found - run setup first" error message fails this job clearly rather than
      # silently skipping the real build.
      #
      # Each CI job runs on its own fresh VM - the cache step above restores ~/pico-toolchain's
      # git checkouts/build dirs (populated by unit-tests' own scripts/test.sh run earlier in this
      # same workflow run), but apt-installed system packages never survive across jobs. This bit
      # a first version of this job directly: it assumed the toolchain cache alone was enough and
      # failed with "Compiler 'arm-none-eabi-gcc' not found" - unit-tests never needed the ARM
      # cross-compiler itself (only the already-cached, already-built Unix port binary), so nothing
      # upstream of this job ever installs it. Reuses setup_toolchain.py's own
      # ensure_apt_packages() against versions.toml's apt_packages list - the same single source of
      # truth toolchain/setup_toolchain.py setup itself uses - rather than hand-duplicating the
      # package list here, where it could quietly drift out of sync.
      - name: Install ARM toolchain apt packages
        run: |
          python3 - <<'PYEOF'
          import sys
          from pathlib import Path
          sys.path.insert(0, "toolchain")
          import setup_toolchain as st
          versions = st.load_versions(Path("toolchain/versions.toml"))
          st.ensure_apt_packages(versions["toolchain"]["apt_packages"], skip=False)
          PYEOF
      - name: Build a real firmware.uf2 for ${{ matrix.device }} and verify it
        run: RUN_SLOW_FIRMWARE_BUILD=1 uv run pytest "tests_scripts/test_build_firmware.py::test_real_firmware_build_produces_a_valid_uf2[${{ matrix.device }}]" -v

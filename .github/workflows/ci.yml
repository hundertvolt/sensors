# CI: every lint, type, test and build check as its own job; web jobs gate on web-changes, the per-device jobs read
# devices; every job runs on ubuntu-24.04, never a floating label. Why each job is shaped as it is:
# SPECIFICATION.md B.10.1.
name: CI

# Two triggers on purpose, and `push` is the load-bearing one: a PR conflicted with its base has no
# merge ref, so GitHub creates no pull_request run at all and the branch silently goes untested (128
# commits once, SPECIFICATION.md H.8).
on:
  pull_request:
  push:
    branches: ['**']  # '**' rather than bare `push:`, so pushing a tag doesn't run the suite again

# Shared by both triggers (head_ref on a PR, ref_name on a push name the same branch), so cancel-in-progress keeps one
# run per push; which one survives does not matter, since web-changes compares against the last green commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Deny-by-default GITHUB_TOKEN; each job grants itself contents: read, and web-changes alone adds actions: read to find
# the last green run (B.10.1, enforced by zizmor).
permissions: {}

jobs:
  web-changes:
    # Gates the web tier on whether THIS PUSH touched the website or its tooling, from one workflow
    # file rather than a trigger-level paths: filter (B.10.1, H.8). Python jobs never consult it.
    permissions:
      contents: read
      actions: read  # reads this workflow's run list to find the base below; nothing else
    runs-on: ubuntu-24.04
    # @tunable ci.web_changes_timeout_min = 5
    timeout-minutes: 5
    outputs:
      # No green run to compare a push against: run the web tier rather than guess (B.10.1).
      web: ${{ (github.event_name == 'push' && steps.base.outputs.sha == '') && 'true' || steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Last commit CI passed on this branch
        id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        # A failed or hung lookup leaves sha empty, so the web output runs the whole web tier: it never fails the job.
        run: |
          # @tunable ci.last_green_lookup_timeout_s = 60
          lookup_s=60
          sha=$(timeout "$lookup_s" gh api -X GET "repos/$REPO/actions/workflows/ci.yml/runs" -f branch="$BRANCH" -f status=success -F per_page=1 --jq '.workflow_runs[0].head_sha // empty') || sha=""
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # A push compares against the last commit CI passed on this branch (with none found, the whole web tier
          # runs), so a cancelled or failed run's web change is filtered again; a pull_request ignores base and lists
          # the whole PR (B.10.1).
          base: ${{ steps.base.outputs.sha || github.event.repository.default_branch }}
          filters: |
            web:
              - 'html/**'
              - 'js/**'
              - 'tests_js/**'
              - 'mockdata/**'
              - 'scripts/**'
              - 'src/**'
              - 'buildgen/**'
              - 'devices/**'
              - 'digital_twin/**'
              - 'toolchain/**'
              - 'ext/**'
              - 'package.json'
              - 'package-lock.json'
              - 'eslint.config.js'
              - 'tsconfig*.json'
              - 'vitest.config.js'
              - '.htmlvalidate.json'
              - '.stylelintrc.json'
              - '.nvmrc'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - 'tests_scripts/test_html_validate_config.py'

  devices:
    # The device set, derived from devices/*.toml like tests_scripts/_devices.py - a variant is never
    # named here (CLAUDE.md).
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    # @tunable ci.devices_timeout_min = 5
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: List the devices
        id: list
        run: |
          shopt -s nullglob
          names=()
          for f in devices/*.toml; do
              n=$(basename "$f" .toml)
              [[ $n == zz_test_* ]] || names+=("\"$n\"")
          done
          [ "${#names[@]}" -gt 0 ] || { echo "::error::no devices/*.toml found"; exit 1; }
          (IFS=,; echo "list=[${names[*]}]") >> "$GITHUB_OUTPUT"

  web-lint-and-typecheck:
    # JS/HTML/CSS equivalent of the Python lint-and-typecheck job below - see SPECIFICATION.md
    # Part H.8 for the role mapping (ESLint~ruff, tsc --noEmit~mypy, html-validate/Stylelint have no direct
    # Python-side counterpart).
    needs: web-changes
    if: needs.web-changes.outputs.web == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    # @tunable ci.web_lint_and_typecheck_timeout_min = 5
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - uses: ./.github/actions/uv-sync
      - name: ESLint (js/, tests_js/)
        run: npm run lint
      - name: TypeScript checkJS (tsc --noEmit)
        run: npm run typecheck
      - name: html-validate (html/)
        run: npm run lint:html
      - name: html-validate (every device's built page)
        run: npm run lint:html:built
      # The config's own check: the planted misspellings must fail. The unit-test jobs install no node_modules and
      # skip it, so it is required here.
      - name: html-validate's config (planted attributes fail)
        env:
          HTML_VALIDATE_REQUIRED: "1"
        run: uv run pytest tests_scripts/test_html_validate_config.py -v
      - name: Stylelint (html/)
        run: npm run lint:css

  web-unit-tests:
    # Vitest in real-browser mode (Playwright + Chromium, H.8); the runner has no browser, so it
    # installs its own. Also builds the Unix-port toolchain, sharing unit-tests' cache key, since
    # live-backend.test.js drives a real twin (B.10.1).
    #
    # needs web-lint-and-typecheck for order only: a red web lint never skips the web tests (CLAUDE.md).
    needs: [web-changes, web-lint-and-typecheck]
    if: ${{ !cancelled() && needs.web-changes.outputs.web == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    # @tunable ci.web_unit_tests_timeout_min = 20
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Browser cache, apt mirror check and package cache, one shared action for the four web jobs (B.10.1).
      - name: Install Playwright Chromium and its OS packages
        uses: ./.github/actions/playwright-chromium
      - name: Set up MicroPython toolchain (uv sync, restore or build)
        uses: ./.github/actions/setup-micropython-toolchain
        with:
          build-unix-port: 'true'
      # npm's pretest hook builds every device's website first. Everything but the live PUT matrix,
      # which is its own sharded job below (B.10.1).
      - name: Run unit tests (Vitest, real-browser mode)
        run: npm run test:unit

  web-put-matrix:
    # The live PUT matrix, split out and sharded because it IS the web tier's wall clock (B.10.1);
    # one runner per shard, so the twin's fixed port never collides.
    #
    # needs: web-unit-tests, success-gated on purpose: no three runners on the slow matrix if the
    # fast suite already failed.
    needs: [web-changes, web-unit-tests]
    if: needs.web-changes.outputs.web == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    # @tunable ci.web_put_matrix_timeout_min = 15
    timeout-minutes: 15
    strategy:
      fail-fast: false  # one shard's failure must not hide which cases the other two would have caught
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Browser cache, apt mirror check and package cache, one shared action for the four web jobs (B.10.1).
      - name: Install Playwright Chromium and its OS packages
        uses: ./.github/actions/playwright-chromium
      - name: Set up MicroPython toolchain (uv sync, restore or build)
        uses: ./.github/actions/setup-micropython-toolchain
        with:
          build-unix-port: 'true'
      - name: Run the live PUT matrix (shard ${{ matrix.shard }} of 3)
        run: npm run test:put-matrix
        env:
          PUT_MATRIX_SHARD: ${{ matrix.shard }}/3

  # Split from web-unit-tests because timeout-minutes gates a whole job: an instrumented rerun once
  # killed a job whose real test step had passed (PR #50, run 33856690559; B.10.1).
  web-coverage:
    # Success-gated on purpose, like unit-tests-coverage: nothing to measure if the plain suite failed.
    needs: [web-changes, web-unit-tests]
    if: needs.web-changes.outputs.web == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    # @tunable ci.web_coverage_timeout_min = 20
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Browser cache, apt mirror check and package cache, one shared action for the four web jobs (B.10.1).
      - name: Install Playwright Chromium and its OS packages
        uses: ./.github/actions/playwright-chromium
      - name: Set up MicroPython toolchain (uv sync, restore or build)
        uses: ./.github/actions/setup-micropython-toolchain
        with:
          build-unix-port: 'true'
      # Re-runs the suite instrumented, minus the live matrix, whose js/ paths the mock-server matrix
      # already drives; a red test gates, the report never does (B.10.1).
      - name: Run unit tests with coverage (the test result gates, the report does not)
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee coverage-output.txt
      - name: Add coverage summary to job summary
        if: ${{ always() && hashFiles('coverage-output.txt') != '' }}
        # Quoted heredocs (not `echo '...'`) so the literal markdown backticks need no quoting
        # gymnastics, and one grouped redirect instead of four - both flagged by actionlint's
        # embedded shellcheck (SC2016/SC2129).
        #
        # The table runs from Vitest's coverage header (matched without its colored "%") up to the
        # summary block the run ends with.
        run: |
          {
            cat <<'MD_FENCE_OPEN'
          ### JS coverage (`js/`)
          ```
          MD_FENCE_OPEN
            awk '/Coverage report from/{p=1} /^== Summary: npm test ==/{p=0} p' coverage-output.txt
            cat <<'MD_FENCE_CLOSE'
          ```
          MD_FENCE_CLOSE
          } >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      - name: Upload HTML coverage report artifact
        if: ${{ always() && hashFiles('htmlcov_js/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html-js
          path: htmlcov_js/
        continue-on-error: true

  web-cross-browser-smoke:
    # WebKitGTK, Firefox and Edge - engines Vitest's Playwright mode cannot reach - plus Chromium,
    # one field edit per engine and viewport (H.7 "Cross-browser coverage").
    #
    # needs: web-unit-tests, success-gated on purpose: no browser installs if the fast suite already
    # failed.
    needs: [web-changes, web-unit-tests]
    if: needs.web-changes.outputs.web == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    # @tunable ci.web_cross_browser_smoke_timeout_min = 15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Installed here too: every job is a fresh VM, and without it the Chromium leg failed with
      # "Executable doesn't exist" (B.10.1). always-check: the WebKit install below fetches from the same mirror list.
      - name: Install Playwright Chromium and its OS packages
        uses: ./.github/actions/playwright-chromium
        with:
          always-check: 'true'
      - name: Set up MicroPython toolchain (uv sync, restore or build)
        uses: ./.github/actions/setup-micropython-toolchain
        with:
          build-unix-port: 'true'
      - name: Build every device's website
        run: npm run build:site
      - name: Cache period for the floating Firefox
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      # Firefox+geckodriver float by design: the floor is current Chromium, Firefox and Safari (owner, 2026-09-26,
      # paraphrase); the key rolls monthly and with the installer (agent, 2026-09-30; B.10.1). WebKit and Edge
      # reinstall every run.
      - name: Cache Firefox + geckodriver (conda-forge)
        uses: actions/cache@v6
        with:
          path: ~/cross-browser-toolchain
          key: cross-browser-firefox-${{ runner.os }}-${{ hashFiles('scripts/setup_cross_browser_toolchain.sh') }}-${{ steps.month.outputs.month }}
      - name: Install WebKit, Edge, and Firefox+geckodriver
        run: scripts/setup_cross_browser_toolchain.sh
      - name: Run cross-browser smoke check
        run: node scripts/cross_browser_smoke.mjs --require-all-engines

  lint-and-typecheck:
    # ruff names every scope; scripts/typecheck.sh runs with no arguments, so its main pass checks
    # [tool.mypy]'s files as a local run does, and it always runs the twin and host passes too (B.15).
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    # @tunable ci.lint_and_typecheck_timeout_min = 5
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/uv-sync
      - name: Generate the device modules (ruff checks them)
        run: uv run scripts/_generate_sensortask_modules.py
      - name: Ruff (every scope, the generated device modules included)
        run: uv run ruff check src tests digital_twin tests_hardware buildgen scripts toolchain tests_scripts build/generated_src
      - name: Mypy (all three passes; typecheck.sh)
        run: uv run scripts/typecheck.sh

  shellcheck:
    # Its own stage so the tool has its own check run. scripts/ only: the legacy tree is never in
    # scope (CLAUDE.md).
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    # @tunable ci.shellcheck_timeout_min = 5
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/uv-sync
      - name: Shellcheck (scripts/)
        run: uv run shellcheck scripts/*.sh

  actionlint:
    # Checks this workflow and the composite actions for expression/context typos that otherwise
    # only surface as a broken CI run. Also runs shellcheck over every `run:` block, which is why
    # shellcheck-py is on PATH here too (both come from the same `uv sync`).
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    # @tunable ci.actionlint_timeout_min = 5
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/uv-sync
      - name: Actionlint (.github/)
        run: uv run actionlint

  zizmor:
    # Workflow security audit (token scope, credential persistence, pinning). --offline skips the
    # two API audits, so it behaves the same everywhere; policy in .github/zizmor.yml.
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    # @tunable ci.zizmor_timeout_min = 5
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/uv-sync
      - name: Zizmor (.github/)
        run: uv run zizmor --offline .github/

  unit-tests:
    # Runs under the real MicroPython Unix-port interpreter (Part E).
    #
    # needs: lint-and-typecheck is sequencing only, the standing hang backstop; `if: !cancelled()`
    # drops the success gating, so a red lint never skips the tests (CLAUDE.md).
    #
    # Its budget: a warm run plus one hung scenario job's full retry budget, plus 25% (Part N); the
    # per-job timeouts in scripts/test.sh are the real hang defence (B.10.1).
    needs: lint-and-typecheck
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    # @tunable ci.unit_tests_timeout_min = 175
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # test.sh's pytest tier runs JS on the first Node on PATH: the pinned one, as the web jobs set it up (no npm install, no cache).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Its first step is the retried uv sync, ahead of scripts/test.sh: `uv run` builds the whole dev group (CLAUDE.md).
      - name: Set up MicroPython toolchain (uv sync, restore cache)
        uses: ./.github/actions/setup-micropython-toolchain
      - name: Run unit tests
        run: scripts/test.sh

  # The (f) stage of CLAUDE.md's memory-safety rule: the same suite at the boot entry's
  # gc.threshold(32768), on a design already passing at -1 above. Its own job, off the critical path
  # (B.10.1).
  unit-tests-gc-threshold:
    name: Unit tests (shipped gc.threshold)
    needs: lint-and-typecheck
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    # @tunable ci.unit_tests_gc_threshold_timeout_min = 175
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # test.sh's pytest tier runs JS on the first Node on PATH: the pinned one, as the web jobs set it up (no npm install, no cache).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Set up MicroPython toolchain (uv sync, restore cache)
        uses: ./.github/actions/setup-micropython-toolchain
      - name: Run unit tests at the shipped gc.threshold
        # @tunable gc.threshold_bytes = 32768
        run: GC_THRESHOLD=32768 scripts/test.sh

  # Split from unit-tests for the same reason web-coverage is; needs: unit-tests only to reuse its
  # toolchain cache, running in parallel with the two jobs below (B.10.1).
  #
  # Its budget: a warm run plus the pytest tier's full timeout-retry budget, plus 25% (Part N); a
  # tighter cap once cancelled a passed suite and digital-twin-e2e with it.
  unit-tests-coverage:
    # Success-gated on purpose (no `if: !cancelled()`): there is nothing to measure if the plain
    # suite did not pass. Its own test step gates; only the reports are advisory (Part E.5.3).
    needs: unit-tests
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    # @tunable ci.unit_tests_coverage_timeout_min = 95
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # test.sh's pytest tier runs JS on the first Node on PATH: the pinned one, as the web jobs set it up (no npm install, no cache).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Set up MicroPython toolchain (uv sync, restore cache)
        uses: ./.github/actions/setup-micropython-toolchain
      # Report steps are `always() && hashFiles(...)` and continue-on-error, so a red test never
      # swallows what did render.
      #
      # This step is NOT advisory (owner, 2026-09-22): build-settrace is the only interpreter no
      # other job runs. Exit 1 (a test failed) goes red; exit 3 (only the coverage is short) stays
      # advisory (Part E.5.3).
      - name: Run unit tests with coverage (the test result gates, the report does not)
        run: |
          status=0
          scripts/test.sh --coverage || status=$?
          if [ "$status" -eq 3 ]; then
              echo "::warning::coverage short (a report did not render or a tracer ended early), but every test passed (exit 3) - see the run's Notes"
              exit 0
          fi
          exit "$status"
      - name: Add coverage summary to job summary
        if: ${{ always() && hashFiles('coverage_summary.md') != '' }}
        run: cat coverage_summary.md >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      - name: Add digital_twin/ coverage summary to job summary
        if: ${{ always() && hashFiles('coverage_summary_digital_twin.md') != '' }}
        run: cat coverage_summary_digital_twin.md >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      - name: Add generated-module coverage summary to job summary
        if: ${{ always() && hashFiles('coverage_summary_generated.md') != '' }}
        run: cat coverage_summary_generated.md >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      - name: Add host build-chain coverage summary to job summary
        if: ${{ always() && hashFiles('coverage_summary_host.md') != '' }}
        run: cat coverage_summary_host.md >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      - name: Upload HTML coverage report artifact
        if: ${{ always() && hashFiles('htmlcov/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: htmlcov/
        continue-on-error: true
      - name: Upload digital_twin/ HTML coverage report artifact
        if: ${{ always() && hashFiles('htmlcov_digital_twin/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html-digital-twin
          path: htmlcov_digital_twin/
        continue-on-error: true
      - name: Upload generated-module HTML coverage report artifact
        if: ${{ always() && hashFiles('htmlcov_generated/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html-generated
          path: htmlcov_generated/
        continue-on-error: true
      - name: Upload host build-chain HTML coverage report artifact
        if: ${{ always() && hashFiles('htmlcov_host/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html-host
          path: htmlcov_host/
        continue-on-error: true


  digital-twin-e2e:
    # The automated twin walkthrough - fresh boot, every endpoint, fault injection, persistence
    # across real process restarts, soak (digital_twin/README.md); heavier than the unit tier, not a
    # duplicate.
    #
    # One job per device by both GC stages by the two parts (suite, harness), fail-fast: false - each
    # waits on real state transitions that parallelize across jobs (B.10.1).
    #
    # needs: unit-tests, success-gated on purpose: fail-fast is the intent, and the cache is then
    # warm.
    needs: [unit-tests, devices]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    # @tunable ci.digital_twin_e2e_timeout_min = 20
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.devices.outputs.list) }}
        gc_threshold: [-1, 32768]
        part: [suite, harness]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up MicroPython toolchain (uv sync, restore cache)
        uses: ./.github/actions/setup-micropython-toolchain
      - name: Run digital-twin clean/build/test cycle
        env:
          DEVICE: ${{ matrix.device }}
          TWIN_GC_THRESHOLD: ${{ matrix.gc_threshold }}
          TWIN_PART: ${{ matrix.part }}
        run: scripts/run_digital_twin_ci.sh "$DEVICE" --gc-threshold "$TWIN_GC_THRESHOLD" --part "$TWIN_PART"
      - name: Upload digital-twin subprocess logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: digital-twin-ci-logs-${{ matrix.device }}-gc${{ matrix.gc_threshold }}-${{ matrix.part }}
          path: digital_twin_ci_logs/
          if-no-files-found: ignore
        continue-on-error: true

  firmware-build-verify:
    # Builds a real firmware.uf2 per device (B.11) - that the assembly links, beyond
    # test_build_firmware.py's fast tests. One job per device, fail-fast: false.
    #
    # needs: unit-tests for the toolchain cache only, so `if: !cancelled()`: a cache dependency must
    # not gate an independent finding; the device list is a real input, so devices must pass (B.10.1).
    needs: [unit-tests, devices]
    if: ${{ !cancelled() && needs.devices.result == 'success' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    # @tunable ci.firmware_build_verify_timeout_min = 20
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.devices.outputs.list) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up MicroPython toolchain (uv sync, restore cache)
        uses: ./.github/actions/setup-micropython-toolchain
      # The list ensure_apt_packages() installs below, read as it reads it, and the bound of each of its download attempts,
      # for the mirror check and package cache around that install; like every step of theirs it cannot fail the job (B.10.1).
      - name: The ARM toolchain's apt packages
        id: apt-packages
        continue-on-error: true
        run: |
          source scripts/_require_python.sh
          require_python311
          python3 - >> "$GITHUB_OUTPUT" <<'PYEOF'
          import sys
          from pathlib import Path
          sys.path.insert(0, "toolchain")
          import setup_toolchain as st
          versions = st.load_versions(Path("toolchain/versions.toml"))
          print("list=" + " ".join(versions["toolchain"]["apt_packages"]))
          print(f"bound-s={st._APT_STEP_TIMEOUT_S}")
          PYEOF
      - name: Check the apt mirror and restore cached packages
        id: apt
        uses: ./.github/actions/apt-cache-restore
        with:
          family: firmware
          packages: ${{ steps.apt-packages.outputs.list }}
          bound-s: ${{ steps.apt-packages.outputs.bound-s }}
          bound-from: tool.apt_step_timeout_s
      # A cache miss fails the picotool step below by name (no cached build tree), never skipping the
      # build.
      #
      # apt packages never survive between jobs, so the ARM compiler is installed here from
      # versions.toml via ensure_apt_packages(); without it this job once failed with
      # "arm-none-eabi-gcc not found".
      - name: Install ARM toolchain apt packages
        run: |
          source scripts/_require_python.sh
          require_python311
          python3 - <<'PYEOF'
          import sys
          from pathlib import Path
          sys.path.insert(0, "toolchain")
          import setup_toolchain as st
          versions = st.load_versions(Path("toolchain/versions.toml"))
          st.ensure_apt_packages(versions["toolchain"]["apt_packages"], skip=False)
          PYEOF
      # Right after the install, so no later step's failure costs the save.
      - name: Keep the fetched packages
        if: ${{ !cancelled() }}
        uses: ./.github/actions/apt-cache-save
        with:
          family: firmware
          key: ${{ steps.apt.outputs.key }}
          cache-hit: ${{ steps.apt.outputs.cache-hit }}
      # picotool lives in /usr/local, outside the cache; its build tree is inside it, so a hit installs
      # the very binary setup built (B.10.1).
      - name: Install the cached picotool
        run: |
          if [ ! -x /usr/local/bin/picotool ]; then sudo make -C "$HOME/pico-toolchain/picotool/build" install; fi
          /usr/local/bin/picotool version
      - name: Build a real firmware.uf2 for ${{ matrix.device }} and verify it
        env:
          DEVICE: ${{ matrix.device }}
        run: RUN_SLOW_FIRMWARE_BUILD=1 uv run pytest "tests_scripts/test_build_firmware.py::test_real_firmware_build_produces_a_valid_uf2[$DEVICE]" -v

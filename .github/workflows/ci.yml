name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    # Gates on src/, tests/, and digital_twin/ (pyproject.toml's [tool.mypy]/[tool.ruff] default
    # scope - both fully-reviewed, expected to stay clean). Passing explicit paths to
    # scripts/typecheck.sh overrides pyproject.toml's `files`/default target for that one
    # invocation without changing what a plain `scripts/lint.sh`/`scripts/typecheck.sh` checks
    # locally (still full-scope: see scripts/typecheck.sh's `mypy "$@"` and ruff's own
    # CLI-args-override-config behavior).
    # digital_twin/ is NOT in the `ruff check`/`scripts/typecheck.sh` args below the way src/tests
    # are - see pyproject.toml's [tool.mypy] exclude comment and digital_twin/typecheck.ini's own
    # docstring for why mypy needs a wholly separate invocation for it (bare `machine`/`network`/
    # `neopixel` module names can only resolve one way per mypy run); scripts/typecheck.sh already
    # runs that second pass unconditionally, regardless of "$@", so the Mypy step below gates on
    # digital_twin/ too without needing it named here explicitly. Ruff has no such per-run
    # resolution conflict, so it's just named directly alongside src/tests.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        run: pip install uv
      - name: Sync dev dependencies
        run: uv sync
      - name: Ruff (src/, tests/, digital_twin/)
        run: uv run ruff check src tests digital_twin
      - name: Mypy (src/, tests/, digital_twin/)
        run: uv run scripts/typecheck.sh src tests

  unit-tests:
    # Tests run under a real MicroPython Unix-port interpreter, not CPython - see
    # BACKLOG.md's "Self-contained venv via uv" testing requirement and SPECIFICATION.md Part E.
    #
    # needs: lint-and-typecheck - serializes the two jobs in this workflow instead of letting them
    # run in parallel (the previous default). This dates from an earlier phase of the CI-hang
    # investigation, when the leading theory was that concurrent job load on GitHub's shared
    # runners caused the hang; that theory was wrong (see CLAUDE.md's "CI hang investigation" note
    # for the real root cause and fix). Job sequencing didn't fix the hang and isn't required for
    # it, but it's kept anyway - cheap, harmless, and removes one more source of self-inflicted
    # concurrency as a standing precaution, per the project owner's direction that slower is fine
    # but hanging never is.
    #
    # timeout-minutes is a job-level backstop, not the primary defense against hangs -
    # scripts/test.sh itself wraps every individual test file in a per-file timeout (with two
    # retries; see scripts/test.sh's own comment on that and on why it, like this job sequencing,
    # turned out not to be what actually fixed the hang). That inner per-file timeout means any
    # future hang would surface as a fast, attributable failure within minutes instead of silently
    # consuming the whole job; timeout-minutes here only guards against a genuinely pathological
    # run (many files hanging at once) rather than being the only thing standing between a stuck
    # test and GitHub's own 360-minute hard limit (the scenario that produced the originally-
    # observed 6-hour hang before timeout-minutes existed - see CLAUDE.md's "CI hang investigation"
    # note). With a warm toolchain cache, a healthy run takes ~8-9 minutes total (plain + coverage
    # passes combined - confirmed by direct local measurement).
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        run: pip install uv
      - name: Cache MicroPython Unix port build
        uses: actions/cache@v6
        with:
          path: ~/pico-toolchain
          # Must also hash toolchain/setup_toolchain.py, not just versions.toml: the Unix port's
          # build flags (e.g. MICROPY_PY_SYS_SETTRACE=1 - see build_unix_port()) live in that
          # script, not in versions.toml. Keying on versions.toml alone let a stale cached binary
          # built before that flag existed survive untouched across this PR's own commits - a real
          # bug, not hypothetical: it's exactly what caused `scripts/test.sh --coverage` to fail in
          # CI with "module 'sys' has no attribute 'settrace'" while working locally, since a local
          # run always starts from a genuinely fresh ~/pico-toolchain.
          key: unix-port-${{ runner.os }}-${{ hashFiles('toolchain/versions.toml', 'toolchain/setup_toolchain.py') }}
      - name: Run unit tests
        run: scripts/test.sh
      # Coverage is a report, not a gate (see SPECIFICATION.md Part E.5 ("Coverage")) - never let
      # it fail the job. The `Run unit tests` step above is the real pass/fail signal; this just
      # re-runs the same suite under the same Unix port binary (always built with
      # MICROPY_PY_SYS_SETTRACE=1 - see build_unix_port()), wrapped by tests/_coverage_runner.py
      # this time, to measure src/ AND digital_twin/ line coverage (two separate reports from one
      # shared run - see scripts/test.sh's own comment).
      - name: Run unit tests with coverage
        run: scripts/test.sh --coverage
        continue-on-error: true
      - name: Add coverage summary to job summary
        if: hashFiles('coverage_summary.md') != ''
        run: cat coverage_summary.md >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      - name: Add digital_twin/ coverage summary to job summary
        if: hashFiles('coverage_summary_digital_twin.md') != ''
        run: cat coverage_summary_digital_twin.md >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      # Free for public repos; needs a CODECOV_TOKEN repo secret (or Codecov's tokenless PR-from-
      # fork support) once this repo is registered at codecov.io - not something CI itself can set
      # up. fail_ci_if_error keeps a missing/invalid token from ever failing the job either way.
      - name: Upload coverage to Codecov
        if: hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
        continue-on-error: true
      - name: Upload digital_twin/ coverage to Codecov
        if: hashFiles('coverage_digital_twin.xml') != ''
        uses: codecov/codecov-action@v7
        with:
          files: coverage_digital_twin.xml
          flags: digital_twin
          fail_ci_if_error: false
        continue-on-error: true
      - name: Upload HTML coverage report artifact
        if: hashFiles('htmlcov/index.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: htmlcov/
        continue-on-error: true
      - name: Upload digital_twin/ HTML coverage report artifact
        if: hashFiles('htmlcov_digital_twin/index.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html-digital-twin
          path: htmlcov_digital_twin/
        continue-on-error: true

  digital-twin-e2e:
    # Automated version of the digital twin's on-demand manual walkthrough (fresh boot, every GET/
    # PUT endpoint, DebugLevel=5 verbose logging, bus fault injection, settings/error persistence
    # across a real process reboot, soak) - see digital_twin/README.md's "Automated CI suite"
    # section and scripts/run_digital_twin_ci.sh's own header comment for the full reference.
    # Deliberately a separate job from unit-tests above: this drives digital_twin/
    # run_wozi_integration.py as a real subprocess over real HTTP through several genuine process
    # restarts (to prove persistence survives an actual reboot, not just an in-process rebuild of
    # the object graph the way tests/test_digital_twin_sensortask_integration.py already does) -
    # a fundamentally different, heavier kind of check than the fast unit-test tier, not a
    # duplicate of it.
    #
    # needs: unit-tests - runs after the unit-test tier both for fail-fast ordering (no reason to
    # spend several more minutes on a full boot/reboot/soak cycle if the fast unit tests already
    # caught a regression) and so this job's own toolchain-cache restore, below, can hit the same
    # cache unit-tests' own unix-port-build step just populated.
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        run: pip install uv
      - name: Cache MicroPython Unix port build
        uses: actions/cache@v6
        with:
          path: ~/pico-toolchain
          # Same cache key as the unit-tests job's own identical step above - see that step's
          # comment for why both toolchain/setup_toolchain.py and toolchain/versions.toml must be
          # hashed together.
          key: unix-port-${{ runner.os }}-${{ hashFiles('toolchain/versions.toml', 'toolchain/setup_toolchain.py') }}
      - name: Run digital-twin clean/build/test cycle
        run: scripts/run_digital_twin_ci.sh
      - name: Upload digital-twin subprocess logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: digital-twin-ci-logs
          path: digital_twin_ci_logs/
          if-no-files-found: ignore
        continue-on-error: true

name: CI

# Two triggers on purpose, and `push` is the load-bearing one: a PR conflicted with its base has no
# merge ref, so GitHub creates no pull_request run at all and the branch silently goes untested (128
# commits once, SPECIFICATION.md H.8).
on:
  pull_request:
  push:
    branches: ['**']  # '**' rather than bare `push:`, so pushing a tag doesn't run the suite again

# Shared by both triggers (head_ref on a PR, ref_name on a push name the same branch), so
# cancel-in-progress keeps exactly one run per push; which survives does not matter (H.8).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Deny-by-default GITHUB_TOKEN; each job grants itself contents: read and nothing needs more
# (B.10.1, enforced by zizmor).
permissions: {}

jobs:
  web-changes:
    # Gates the web tier on whether THIS PUSH touched the website or its tooling, from one workflow
    # file rather than a trigger-level paths: filter (B.10.1, H.8). Python jobs never consult it.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # v3
        id: filter
        with:
          # Without a base, a push is compared against the default branch; naming the pushed branch
          # compares against the commit before the push. A pull_request ignores it and uses the PR
          # base (B.10.1).
          base: ${{ github.ref }}
          filters: |
            web:
              - 'html/**'
              - 'js/**'
              - 'tests_js/**'
              - 'mockdata/**'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'eslint.config.js'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - 'vitest.config.js'
              - '.htmlvalidate.json'
              - '.stylelintrc.json'
              - '.nvmrc'

  web-lint-and-typecheck:
    # JS/HTML/CSS equivalent of the Python lint-and-typecheck job below - see SPECIFICATION.md
    # Part H.8 for the role mapping (ESLint~ruff, tsc --noEmit~mypy, html-validate/Stylelint have no direct
    # Python-side counterpart).
    needs: web-changes
    if: needs.web-changes.outputs.web == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: ESLint (js/, tests_js/)
        run: npm run lint
      - name: TypeScript checkJS (tsc --noEmit)
        run: npm run typecheck
      - name: html-validate (html/)
        run: npm run lint:html
      - name: Stylelint (html/)
        run: npm run lint:css

  web-unit-tests:
    # Vitest in real-browser mode (Playwright + Chromium, H.8); the runner has no browser, so it
    # installs its own. Also builds the Unix-port toolchain, sharing unit-tests' cache key, since
    # live-backend.test.js drives a real twin (B.10.1).
    needs: [web-changes, web-lint-and-typecheck]
    if: needs.web-changes.outputs.web == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Playwright's browser cached on package-lock.json (which pins its version); OS packages
      # reinstalled every run - Playwright's documented CI pattern.
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Set up MicroPython toolchain (install uv, restore cache)
        uses: ./.github/actions/setup-micropython-toolchain
      - name: Build MicroPython Unix port (if not cached)
        run: |
          bin="$HOME/pico-toolchain/micropython/ports/unix/build-standard/micropython"
          if [ ! -x "$bin" ]; then
            uv run toolchain/setup_toolchain.py setup
          fi
      # npm's pretest hook builds the real wozi website first. Everything but the live PUT matrix,
      # which is its own sharded job below (B.10.1).
      - name: Run unit tests (Vitest, real-browser mode)
        run: npm run test:unit

  web-put-matrix:
    # The live PUT matrix, split out and sharded because it IS the web tier's wall clock (B.10.1);
    # one runner per shard, so the twin's fixed port never collides.
    #
    # needs: web-unit-tests - no three runners on the slow matrix if the fast suite already failed.
    needs: [web-changes, web-unit-tests]
    if: needs.web-changes.outputs.web == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false  # one shard's failure must not hide which cases the other two would have caught
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Set up MicroPython toolchain (install uv, restore cache)
        uses: ./.github/actions/setup-micropython-toolchain
      - name: Build MicroPython Unix port (if not cached)
        run: |
          bin="$HOME/pico-toolchain/micropython/ports/unix/build-standard/micropython"
          if [ ! -x "$bin" ]; then
            uv run toolchain/setup_toolchain.py setup
          fi
      - name: Run the live PUT matrix (shard ${{ matrix.shard }} of 3)
        run: npm run test:put-matrix
        env:
          PUT_MATRIX_SHARD: ${{ matrix.shard }}/3

  # Split from web-unit-tests because timeout-minutes gates a whole job: an instrumented rerun once
  # killed a job whose real test step had passed (PR #50, run 33856690559; B.10.1).
  web-coverage:
    needs: [web-changes, web-unit-tests]
    if: needs.web-changes.outputs.web == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Set up MicroPython toolchain (install uv, restore cache)
        uses: ./.github/actions/setup-micropython-toolchain
      - name: Build MicroPython Unix port (if not cached)
        run: |
          bin="$HOME/pico-toolchain/micropython/ports/unix/build-standard/micropython"
          if [ ! -x "$bin" ]; then
            uv run toolchain/setup_toolchain.py setup
          fi
      # A report, not a gate; re-runs the suite instrumented, minus the live matrix, whose js/ paths
      # the mock-server matrix already drives (B.10.1).
      - name: Run unit tests with coverage
        run: npm run test:coverage 2>&1 | tee coverage-output.txt
        continue-on-error: true
      - name: Add coverage summary to job summary
        if: hashFiles('coverage-output.txt') != ''
        # Quoted heredocs (not `echo '...'`) so the literal markdown backticks need no quoting
        # gymnastics, and one grouped redirect instead of four - both flagged by actionlint's
        # embedded shellcheck (SC2016/SC2129).
        run: |
          {
            cat <<'MD_FENCE_OPEN'
          ### JS coverage (`js/`)
          ```
          MD_FENCE_OPEN
            tail -n 15 coverage-output.txt
            cat <<'MD_FENCE_CLOSE'
          ```
          MD_FENCE_CLOSE
          } >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      - name: Upload HTML coverage report artifact
        if: hashFiles('htmlcov_js/index.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html-js
          path: htmlcov_js/
        continue-on-error: true

  web-cross-browser-smoke:
    # WebKitGTK, Firefox and Edge - engines Vitest's Playwright mode cannot reach - plus Chromium,
    # one field edit per engine and viewport (H.7 "Cross-browser coverage").
    #
    # needs: web-unit-tests, fail-fast: no browser installs if the fast suite already failed.
    needs: [web-changes, web-unit-tests]
    if: needs.web-changes.outputs.web == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Installed here too: every job is a fresh VM, and without it the Chromium leg failed with
      # "Executable doesn't exist" (B.10.1).
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Set up MicroPython toolchain (install uv, restore cache)
        uses: ./.github/actions/setup-micropython-toolchain
      - name: Build MicroPython Unix port (if not cached) and the real wozi website
        run: |
          bin="$HOME/pico-toolchain/micropython/ports/unix/build-standard/micropython"
          if [ ! -x "$bin" ]; then
            uv run toolchain/setup_toolchain.py setup
          fi
          scripts/build_website.sh wozi
          uv run scripts/_generate_sensortask_modules.py
      # Firefox+geckodriver from conda-forge (~106 MB, nothing to key on) cached under a fixed key -
      # bump the suffix to force a refresh. WebKit and Edge reinstall every run (B.10.1).
      - name: Cache Firefox + geckodriver (conda-forge)
        uses: actions/cache@v6
        with:
          path: ~/cross-browser-toolchain
          key: cross-browser-firefox-v1-${{ runner.os }}
      - name: Install WebKit, Edge, and Firefox+geckodriver
        run: scripts/setup_cross_browser_toolchain.sh
      - name: Run cross-browser smoke check
        run: node scripts/cross_browser_smoke.mjs

  lint-and-typecheck:
    # ruff names every scope; mypy names only the main pass's, since scripts/typecheck.sh always
    # runs the twin and host passes too (B.15). Explicit paths narrow only this CI call; a local run
    # stays full-scope.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        run: pip install uv
      # Retried here too, not just in the test lanes below: `actionlint-py` ships no wheel and
      # fetches its binary inside its own build backend, so one bad response fails a lane on a tree
      # where nothing is wrong - HTTP 500 on 2026-09-13, 504 on 2026-09-14, on shell-free lanes.
      - name: Sync dev dependencies (retried - third-party build downloads are not always up)
        run: |
          for attempt in 1 2 3; do
              uv sync && exit 0
              echo "uv sync failed on attempt $attempt/3; retrying in $((attempt * 10))s" >&2
              sleep $((attempt * 10))
          done
          uv sync
      - name: Ruff (src/, tests/, digital_twin/, tests_hardware/, and the whole host build chain)
        run: uv run ruff check src tests digital_twin tests_hardware buildgen scripts toolchain tests_scripts
      - name: Mypy (src/, tests/, digital_twin/, tests_hardware/device_scripts/, and the whole host build chain)
        run: uv run scripts/typecheck.sh src tests tests_hardware/device_scripts

  shellcheck:
    # Its own stage so the tool has its own check run. scripts/ only: the legacy build-*.sh are out
    # of scope forever (CLAUDE.md).
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        run: pip install uv
      # Retried for the same reason as lint-and-typecheck's own sync above.
      - name: Sync dev dependencies (retried - third-party build downloads are not always up)
        run: |
          for attempt in 1 2 3; do
              uv sync && exit 0
              echo "uv sync failed on attempt $attempt/3; retrying in $((attempt * 10))s" >&2
              sleep $((attempt * 10))
          done
          uv sync
      - name: Shellcheck (scripts/)
        run: uv run shellcheck scripts/*.sh

  actionlint:
    # Checks this workflow and the composite action for expression/context typos that otherwise
    # only surface as a broken CI run. Also runs shellcheck over every `run:` block, which is why
    # shellcheck-py is on PATH here too (both come from the same `uv sync`).
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        run: pip install uv
      # Retried for the same reason as lint-and-typecheck's own sync above.
      - name: Sync dev dependencies (retried - third-party build downloads are not always up)
        run: |
          for attempt in 1 2 3; do
              uv sync && exit 0
              echo "uv sync failed on attempt $attempt/3; retrying in $((attempt * 10))s" >&2
              sleep $((attempt * 10))
          done
          uv sync
      - name: Actionlint (.github/)
        run: uv run actionlint

  zizmor:
    # Workflow security audit (token scope, credential persistence, pinning). --offline skips the
    # two API audits, so it behaves the same everywhere; policy in .github/zizmor.yml.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        run: pip install uv
      # Retried for the same reason as lint-and-typecheck's own sync above.
      - name: Sync dev dependencies (retried - third-party build downloads are not always up)
        run: |
          for attempt in 1 2 3; do
              uv sync && exit 0
              echo "uv sync failed on attempt $attempt/3; retrying in $((attempt * 10))s" >&2
              sleep $((attempt * 10))
          done
          uv sync
      - name: Zizmor (.github/)
        run: uv run zizmor --offline .github/

  unit-tests:
    # Runs under the real MicroPython Unix-port interpreter (Part E).
    #
    # needs: lint-and-typecheck is sequencing only, the standing hang backstop; `if: !cancelled()`
    # drops the success gating, so a red lint never skips the tests (CLAUDE.md).
    #
    # 45 minutes: a ~17-minute warm run plus one hung file's full retry budget; the per-file timeout
    # in scripts/test.sh is the real hang defence (B.10.1).
    needs: lint-and-typecheck
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up MicroPython toolchain (install uv, restore cache)
        uses: ./.github/actions/setup-micropython-toolchain
      # Retried sync first: `uv run` builds the whole dev group, actionlint-py's binary download
      # included, so a third party's outage must not read as a red test (CLAUDE.md, B.10). test.sh
      # then rebuilds nothing.
      - name: Sync dev dependencies (retried - third-party build downloads are not always up)
        run: |
          for attempt in 1 2 3; do
              uv sync && exit 0
              echo "uv sync failed on attempt $attempt/3; retrying in $((attempt * 10))s" >&2
              sleep $((attempt * 10))
          done
          uv sync
      - name: Run unit tests
        run: scripts/test.sh

  # The (f) stage of CLAUDE.md's memory-safety rule: the same suite at the boot entry's
  # gc.threshold(32768), on a design already passing at -1 above. Its own job, off the critical path
  # (B.10.1).
  unit-tests-gc-threshold:
    name: Unit tests (shipped gc.threshold)
    needs: lint-and-typecheck
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up MicroPython toolchain (install uv, restore cache)
        uses: ./.github/actions/setup-micropython-toolchain
      - name: Run unit tests at the shipped gc.threshold
        run: GC_THRESHOLD=32768 scripts/test.sh

  # Split from unit-tests for the same reason web-coverage is; needs: unit-tests only to reuse its
  # toolchain cache, running in parallel with the two jobs below (B.10.1).
  #
  # 45 minutes over the measured 14m01s/16m56s instrumented reruns; a 30-minute cap once cancelled a
  # passed suite and digital-twin-e2e with it (run 34755468619).
  unit-tests-coverage:
    # Success-gated on purpose (no `if: !cancelled()`, unlike unit-tests' own edge above): there is
    # nothing to measure if the plain suite did not pass. Note this job is no longer purely
    # advisory - its own test step gates now, for the reason that step's comment gives.
    needs: unit-tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up MicroPython toolchain (install uv, restore cache)
        uses: ./.github/actions/setup-micropython-toolchain
      # scripts/test.sh's pytest tier shells out to `uv run`, which implicitly builds the WHOLE
      # dev group before it runs anything (see the unit-tests job above for the full account of
      # why this sync is here and retried).
      - name: Sync dev dependencies (retried - third-party build downloads are not always up)
        run: |
          for attempt in 1 2 3; do
              uv sync && exit 0
              echo "uv sync failed on attempt $attempt/3; retrying in $((attempt * 10))s" >&2
              sleep $((attempt * 10))
          done
          uv sync
      # Report steps are `always() && hashFiles(...)` and continue-on-error, so a red test never
      # swallows what did render. The instrumented rerun measures src/ and digital_twin/ from one
      # run.
      #
      # This step is NOT advisory: build-settrace is the only interpreter no other job runs. Exit 1
      # (a test failed) goes red; exit 3 (only the report failed) stays advisory (Part E.5.3).
      - name: Run unit tests with coverage (the test result gates, the report does not)
        run: |
          status=0
          scripts/test.sh --coverage || status=$?
          if [ "$status" -eq 3 ]; then
              echo "::warning::coverage rendering failed, but every test passed (exit 3) - report only"
              exit 0
          fi
          exit "$status"
      - name: Add coverage summary to job summary
        if: ${{ always() && hashFiles('coverage_summary.md') != '' }}
        run: cat coverage_summary.md >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      - name: Add digital_twin/ coverage summary to job summary
        if: ${{ always() && hashFiles('coverage_summary_digital_twin.md') != '' }}
        run: cat coverage_summary_digital_twin.md >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      # Free for public repos; needs a CODECOV_TOKEN repo secret (or Codecov's tokenless PR-from-
      # fork support) once this repo is registered at codecov.io - not something CI itself can set
      # up. fail_ci_if_error keeps a missing/invalid token from ever failing the job either way.
      - name: Upload coverage to Codecov
        if: ${{ always() && hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
        continue-on-error: true
      - name: Upload digital_twin/ coverage to Codecov
        if: ${{ always() && hashFiles('coverage_digital_twin.xml') != '' }}
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        with:
          files: coverage_digital_twin.xml
          flags: digital_twin
          fail_ci_if_error: false
        continue-on-error: true
      - name: Upload HTML coverage report artifact
        if: ${{ always() && hashFiles('htmlcov/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: htmlcov/
        continue-on-error: true
      - name: Upload digital_twin/ HTML coverage report artifact
        if: ${{ always() && hashFiles('htmlcov_digital_twin/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html-digital-twin
          path: htmlcov_digital_twin/
        continue-on-error: true


  digital-twin-e2e:
    # The automated twin walkthrough - fresh boot, every endpoint, fault injection, persistence
    # across real process restarts, soak (digital_twin/README.md); heavier than the unit tier, not a
    # duplicate.
    #
    # Six-device matrix, fail-fast: false - each suite waits on real state transitions that
    # parallelize across jobs (B.10.1).
    #
    # needs: unit-tests, success-gated on purpose: fail-fast is the intent, and the cache is then
    # warm.
    needs: unit-tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: [wozi, dev, arzi, klkizi, grkizi, schlafzi]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up MicroPython toolchain (install uv, restore cache)
        uses: ./.github/actions/setup-micropython-toolchain
      - name: Run digital-twin clean/build/test cycle
        run: scripts/run_digital_twin_ci.sh "${{ matrix.device }}"
      - name: Upload digital-twin subprocess logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: digital-twin-ci-logs-${{ matrix.device }}
          path: digital_twin_ci_logs/
          if-no-files-found: ignore
        continue-on-error: true

  firmware-build-verify:
    # Builds a real firmware.uf2 per device (B.11) - that the assembly links, beyond
    # test_build_firmware.py's fast tests. Six-device matrix, fail-fast: false.
    #
    # needs: unit-tests for the toolchain cache only, so `if: !cancelled()`: a cache dependency must
    # not gate an independent finding (B.10.1).
    needs: unit-tests
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        device: [wozi, dev, arzi, klkizi, grkizi, schlafzi]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up MicroPython toolchain (install uv, restore cache)
        uses: ./.github/actions/setup-micropython-toolchain
      # A cache miss fails on build_firmware.py's own "no toolchain found" rather than skipping the
      # build.
      #
      # apt packages never survive between jobs, so the ARM compiler is installed here from
      # versions.toml via ensure_apt_packages(); without it this job once failed with
      # "arm-none-eabi-gcc not found".
      - name: Install ARM toolchain apt packages
        run: |
          python3 - <<'PYEOF'
          import sys
          from pathlib import Path
          sys.path.insert(0, "toolchain")
          import setup_toolchain as st
          versions = st.load_versions(Path("toolchain/versions.toml"))
          st.ensure_apt_packages(versions["toolchain"]["apt_packages"], skip=False)
          PYEOF
      - name: Build a real firmware.uf2 for ${{ matrix.device }} and verify it
        run: RUN_SLOW_FIRMWARE_BUILD=1 uv run pytest "tests_scripts/test_build_firmware.py::test_real_firmware_build_produces_a_valid_uf2[${{ matrix.device }}]" -v

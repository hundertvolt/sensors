# zizmor (GitHub Actions security audit) config, run offline by scripts/lint.sh and CI's zizmor job. Two audits are
# configured, unpinned-uses's policy and self-repository's disable; every other audit runs at its default, so a zizmor
# bump surfaces new checks to triage (CLAUDE.md).
rules:
  unpinned-uses:
    config:
      policies:
        # First-party actions: a tag is enough - a compromised actions/* org compromises the
        # platform itself, and SHA pins would need hand bumps with no Dependabot.
        actions/*: ref-pin
        # Everything third-party (dorny/ today) is pinned to a commit SHA: a force-pushed tag there is the
        # tj-actions/changed-files attack.
        "*": hash-pin
  self-repository:
    # Disabled, not fixed: it wants `uses: $/.github/...`, which actionlint 1.7.12 rejects, so
    # both gates cannot pass (agent, 2026-09-10). Re-enable when actionlint accepts the syntax
    # (checked at each actionlint pin bump).
    disable: true

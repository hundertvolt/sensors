# zizmor (GitHub Actions security audit) config, run offline by scripts/lint.sh. Only unpinned-uses
# is configured; every other audit stays at its default, so a new release surfaces new checks to
# triage (policy: CLAUDE.md).
rules:
  unpinned-uses:
    config:
      policies:
        # First-party actions: a tag is enough - a compromised actions/* org compromises the
        # platform itself, and SHA pins would need hand bumps with no Dependabot.
        actions/*: ref-pin
        # Everything third-party (codecov/, dorny/) is SHA-pinned: a force-pushed tag there is the
        # tj-actions/changed-files attack.
        "*": hash-pin
  self-repository:
    # Disabled, not fixed: it wants `uses: $/.github/...`, which actionlint 1.7.12 rejects as
    # invalid, so both gates cannot pass. Low severity; revisit once actionlint learns the syntax
    # (CLAUDE.md).
    disable: true

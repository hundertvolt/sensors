# Restores (or builds) the cached MicroPython Unix-port toolchain after the retried uv sync - used by nine CI jobs (SPECIFICATION.md B.10).
name: Setup MicroPython toolchain
description: >
  Runs the retried uv sync, restores the Unix-port toolchain cache under ~/pico-toolchain and, with `build-unix-port: 'true'`,
  builds it when missing. Used by web-unit-tests, web-put-matrix, web-coverage, web-cross-browser-smoke, unit-tests,
  unit-tests-gc-threshold, unit-tests-coverage, digital-twin-e2e and firmware-build-verify.

inputs:
  build-unix-port:
    required: false
    default: 'false'
    description: Build the Unix-port toolchain when the restored cache lacks build-standard

runs:
  using: composite
  steps:
    - uses: ./.github/actions/uv-sync
    - name: Runner and compiler identity for the cache key
      id: ident
      shell: bash
      run: printf 'id=%s\n' "$(printf '%s\n' "${ImageOS:-unknown}" "$(gcc --version | head -n1)" "$(ldd --version | head -n1)" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - name: Cache MicroPython Unix port build
      uses: actions/cache@v6
      with:
        path: ~/pico-toolchain
        # Every input compiled into the cached binaries: pin, build flags, build overrides, runner image, host
        # compiler and C library (SPECIFICATION.md B.10).
        key: unix-port-${{ runner.os }}-${{ steps.ident.outputs.id }}-${{ hashFiles('toolchain/versions.toml', 'toolchain/setup_toolchain.py', 'toolchain/micropython_overrides.py') }}
    - name: Build the Unix-port toolchain if the cache lacks it
      if: inputs.build-unix-port == 'true'
      shell: bash
      run: |
        scripts/_unix_port.sh ensure standard
        # Every twin boot binds the local NTP responder's port 123; a restored cache carries no file capabilities.
        sudo setcap 'cap_net_bind_service=+ep' "$(scripts/_unix_port.sh unix_port_bin standard)"

# Installs the pinned uv and runs the one retried uv sync --locked - used by every CI job that needs the Python environment (SPECIFICATION.md B.10).
name: uv sync (retried)
description: >
  Installs the uv version pyproject.toml's [tool.uv] required-version pins, then runs scripts/uv_sync_retried.sh: a third party's
  build-time download (actionlint-py fetches its binary) must not read as a red run (owner, 2026-09-26). Used by lint-and-typecheck,
  shellcheck, actionlint, zizmor, web-lint-and-typecheck and, through setup-micropython-toolchain, nine more jobs.

runs:
  using: composite
  steps:
    - name: Install uv (pinned in pyproject.toml)
      shell: bash
      run: |
        source scripts/_require_python.sh && require_python311
        pip install "uv==$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["uv"]["required-version"].removeprefix("=="))')"
    - name: Sync dev dependencies (retried)
      shell: bash
      run: scripts/uv_sync_retried.sh

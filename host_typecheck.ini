# Dedicated mypy pass for the HOST-CPython scopes: scripts/, toolchain/, tests_scripts/ and
# tests_hardware/. Separate from pyproject.toml's [tool.mypy] for one reason: that pass sets
# `custom_typeshed_dir = typings`, replacing mypy's real typeshed with the MicroPython stubs so
# that `time`/`math`/`select`/`errno` resolve to the firmware's own versions. These four scopes are
# ordinary CPython 3.11 programs that import `ast`, `argparse`, `pathlib`, `subprocess`, ... - none
# of which exist in the MicroPython stub set, so checking them in the main pass reports every
# stdlib import as `Cannot find implementation or library stub`. Same "one module name can only
# resolve one way per run" constraint that already forced digital_twin/typecheck.ini to be its own
# invocation; scripts/typecheck.sh runs this one unconditionally too.
[mypy]
python_version = 3.11
files = scripts, toolchain, tests_scripts, tests_hardware

# tests_hardware/device_scripts/ is the one part of tests_hardware/ that is NOT host CPython: those
# files are MicroPython programs pushed to the Pico and executed there (`import machine`,
# `machine.WDT(...)`), not pytest code that runs on the developer's machine. Checking them against
# the real typeshed reports every MicroPython import as missing - 121 errors, 99 of them pure
# artifact. They belong in pyproject.toml's [tool.mypy] MicroPython pass instead, and are listed
# there; the same host-vs-target split that made this file necessary in the first place.
exclude = (?x)(^tests_hardware/device_scripts/)

# tests_hardware/ has both a top-level conftest.py and tests_hardware/flash/conftest.py. Without
# these, mypy aborts with `Duplicate module named "conftest"` before checking anything: it derives
# a module name per file and both map to bare `conftest`. explicit_package_bases + a mypy_path of
# the repo root makes each one a distinct dotted path instead.
#
# The three tests_hardware/ entries past the repo root mirror what pytest itself does at runtime:
# tests_hardware/conftest.py inserts tests_hardware/ on sys.path (so `import harness`/`http_client`/
# `bench_control`/`soak_tiers`/`error_log_helpers` resolve), pytest's own rootdir insertion puts
# tests_hardware/bench/ there for `import dns_probe`, and tests_hardware/manual/__main__.py does the
# same for tests_hardware/manual/ (`import runner`, and runner.py's own `manual_*` imports). Without
# them every one of those bare imports reports as `Cannot find implementation or library stub`,
# which in turn types the whole harness API as Any. Adding them changes nothing for scripts/,
# toolchain/ or tests_scripts/ - verified by diffing this pass's findings for those three scopes
# before and after.
namespace_packages = true
explicit_package_bases = true
mypy_path = ., tests_hardware, tests_hardware/bench, tests_hardware/manual

# tests_hardware/device_scripts/ is the one part of tests_hardware/ that is NOT host CPython: every
# file there is MicroPython firmware-target code, uploaded to the board by `mpremote run` and
# executed by the board's own interpreter (the flash-tier tests only ever reference them as
# PATHS - see tests_hardware/README.md). They `import machine`, call `time.ticks_ms()`/`sleep_ms()`
# and import src/'s own drivers by bare module name, none of which exist in the real typeshed this
# pass deliberately keeps - so checking them here produces nothing but ~140 unresolvable-import and
# module-has-no-attribute reports, never a real finding. They belong in a MicroPython-typed pass
# (pyproject.toml's [tool.mypy], mypy_path = typings + src) instead; BACKLOG.md records what that
# move costs and the real findings it surfaces, which is why it is not folded into this one.
exclude = ^tests_hardware/device_scripts/

show_error_context = true
show_column_numbers = true
pretty = true

disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true

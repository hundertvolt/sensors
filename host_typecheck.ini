# Dedicated mypy pass for the host-CPython scopes (buildgen, scripts, toolchain, tests_scripts,
# tests_hardware): ordinary CPython 3.11 programs that need mypy's real typeshed, which the main
# pass replaces with MicroPython's (SPECIFICATION.md B.15).
#
# buildgen/ belongs here too: it parses TOML with the real tomllib and walks driver source with the
# real ast.
[mypy]
python_version = 3.11
files = buildgen, scripts, toolchain, tests_scripts, tests_hardware

# device_scripts/ is MicroPython code run on the board (121 errors here, 99 artifacts), checked by
# the main pass instead.
#
# tests_scripts/conftest.py: with both test tiers on mypy_path, both conftests become bare
# `conftest`, a duplicate no per-file setting resolves; it holds two trivial fixtures - an accepted
# gap (B.15).
exclude = (?x)(^tests_hardware/device_scripts/|^tests_scripts/conftest\.py$)

# explicit_package_bases plus `.` give tests_hardware's two conftests distinct dotted names.
#
# The other entries mirror the sys.path pytest builds at runtime (harness, dns_probe, runner,
# _toml_fixtures, micropython_overrides), without which the harness API types as Any (B.15).
namespace_packages = true
explicit_package_bases = true
mypy_path = ., tests_hardware, tests_hardware/bench, tests_hardware/manual, tests_scripts, toolchain

show_error_context = true
show_column_numbers = true
pretty = true

# Full --strict, no exemptions - unlike pyproject.toml's own pass, this scope has no
# monkeypatch-based mocking, so no_implicit_reexport is enforced here too.
strict = true
# Not part of --strict; kept because both remain useful here.
no_implicit_optional = true
warn_unreachable = true

# Dedicated mypy pass for the HOST-CPython scopes: buildgen/, scripts/, toolchain/,
# tests_scripts/ and tests_hardware/. Separate from pyproject.toml's [tool.mypy] for one reason:
# that pass sets `custom_typeshed_dir = typings`, replacing mypy's real typeshed with the
# MicroPython stubs so that `time`/`math`/`select`/`errno` resolve to the firmware's own versions.
# These five scopes are ordinary CPython 3.11 programs that import `ast`, `argparse`, `pathlib`,
# `subprocess`, `tomllib`, ... - none of which exist in the MicroPython stub set, so checking them
# in the main pass reports every stdlib import as `Cannot find implementation or library stub`.
# Same "one module name can only resolve one way per run" constraint that already forced
# digital_twin/typecheck.ini to be its own invocation; scripts/typecheck.sh runs this one
# unconditionally too.
#
# buildgen/ (the device-TOML-to-firmware-module generator, BUILD_CHAIN_PLAN.md's Session 3) parses
# TOML via the real stdlib tomllib and walks driver source via the real stdlib ast - genuinely
# CPython-target host tooling, same as the other four scopes, so it belongs in this pass rather
# than a separate one.
[mypy]
python_version = 3.11
files = buildgen, scripts, toolchain, tests_scripts, tests_hardware

# tests_hardware/device_scripts/ is the one part of tests_hardware/ that is NOT host CPython: those
# files are MicroPython programs pushed to the Pico and executed there (`import machine`,
# `machine.WDT(...)`), not pytest code that runs on the developer's machine. Checking them against
# the real typeshed reports every MicroPython import as missing - 121 errors, 99 of them pure
# artifact. They belong in pyproject.toml's [tool.mypy] MicroPython pass instead, and are listed
# there; the same host-vs-target split that made this file necessary in the first place.
#
# tests_scripts/conftest.py is excluded for a different, real mypy limitation: with both
# "tests_hardware" and "tests_scripts" on mypy_path below (each needed for its own directory's bare
# sibling imports - see that comment), mypy computes BOTH conftest.py files' module name as the
# bare "conftest" (the longest-matching mypy_path entry wins over the "." root, unlike
# tests_hardware/flash/conftest.py, which has no same-named sibling at its own directory depth) -
# a hard "Duplicate module named conftest" that no per-file config resolves, since mypy_path applies
# per-directory, not per-file. tests_hardware/conftest.py stays in scope (nothing bare-imports it,
# so it doesn't need the bare slot, but must still keep winning it - excluding it instead would
# break `import harness`/etc for every other file in that directory). tests_scripts/conftest.py's
# own real logic (load_script_module()) was moved out to _script_loader.py specifically so nothing
# needs IT to resolve bare anymore (BUILD_CHAIN_PLAN.md's Session 3+) - what's left here is two
# trivial pytest fixtures (repo_root/micropython_dir), a real but small, accepted coverage gap
# versus rearchitecting either tier's directory layout to avoid the name clash entirely.
exclude = (?x)(^tests_hardware/device_scripts/|^tests_scripts/conftest\.py$)

# tests_hardware/ has both a top-level conftest.py and tests_hardware/flash/conftest.py. Without
# these, mypy aborts with `Duplicate module named "conftest"` before checking anything: it derives
# a module name per file and both map to bare `conftest`. explicit_package_bases + a mypy_path of
# the repo root makes each one a distinct dotted path instead.
#
# The tests_hardware/ entries past the repo root mirror what pytest itself does at runtime:
# tests_hardware/conftest.py inserts tests_hardware/ on sys.path (so `import harness`/`http_client`/
# `bench_control`/`soak_tiers`/`error_log_helpers` resolve), pytest's own rootdir insertion puts
# tests_hardware/bench/ there for `import dns_probe`, and tests_hardware/manual/__main__.py does the
# same for tests_hardware/manual/ (`import runner`, and runner.py's own `manual_*` imports). Without
# them every one of those bare imports reports as `Cannot find implementation or library stub`,
# which in turn types the whole harness API as Any. Adding them changes nothing for scripts/,
# toolchain/ or tests_scripts/ - verified by diffing this pass's findings for those three scopes
# before and after. The tests_scripts entry is the same pattern for buildgen's own fixture suite:
# tests_scripts/test_buildgen_*.py's `from _toml_fixtures import ...` (and _script_loader.py's
# `load_script_module`) is a bare sibling import, exactly how pytest's own rootdir insertion
# resolves it at runtime (tests_scripts/conftest.py has no package marker either), so tests_scripts/
# needs to be on this path too - see the exclude comment above for the one file this costs.
namespace_packages = true
explicit_package_bases = true
mypy_path = ., tests_hardware, tests_hardware/bench, tests_hardware/manual, tests_scripts

show_error_context = true
show_column_numbers = true
pretty = true

# Full --strict, no exemptions - unlike pyproject.toml's own pass, this scope has no
# monkeypatch-based mocking, so no_implicit_reexport is enforced here too.
strict = true
# Not part of --strict; kept because both remain useful here.
no_implicit_optional = true
warn_unreachable = true

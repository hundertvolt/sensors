# mypy config for the separate digital-twin pass scripts/typecheck.sh runs beside the main one: mypy
# resolves each bare module name to one file per run, and the twin needs machine/network/neopixel to
# mean its own fakes, not the board stub (SPECIFICATION.md B.15).
#
# Confirmed empirically: excluding digital_twin from the main pass alone did not fix its attribute
# resolution, hence this pass.
#
# digital_twin first so the twin's modules win; build/generated_src for run_generic_integration.py
# and segfault_stress_repro.py's sensortask_<device> import (typecheck.sh generates it first). No
# name collides (B.15).
[mypy]
platform = linux
python_version = 3.10
follow_imports = silent
follow_imports_for_stubs = True
mypy_path = digital_twin:src:build/generated_src:typings:tests
custom_typeshed_dir = typings
no_site_packages = True
show_error_context = True
show_column_numbers = True
pretty = True

# Same strictness as the root [tool.mypy], synced by hand (INI has no include), and
# no_implicit_reexport ON: this scope mocks nothing by reassignment.
strict = True
# Not part of --strict; kept because both remain useful here.
no_implicit_optional = True
warn_unreachable = True

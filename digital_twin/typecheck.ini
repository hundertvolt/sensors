# mypy config for the separate digital-twin pass scripts/typecheck.sh runs beside the main one: mypy
# resolves each bare module name to one file per run, and the twin needs machine/network to
# mean its own fakes, not the board stub (SPECIFICATION.md B.15).
#
# Confirmed empirically: excluding digital_twin from the main pass alone did not fix its attribute
# resolution, hence this pass.
#
# digital_twin first so the twin's modules win; its unixport/ subdirectory for the UDP shim and the
# offline-NTP writer; build/generated_src for the runner's device import (typecheck.sh generates it
# first). No name collides (B.15).
[mypy]
files = digital_twin, fakes, tests/test_digital_twin_*.py, tests/_digital_twin_construction_scenarios.py
platform = linux
python_version = 3.10
follow_imports = silent
follow_imports_for_stubs = True
mypy_path = digital_twin:digital_twin/unixport:src:build/generated_src:typings:tests
custom_typeshed_dir = typings
no_site_packages = True
show_error_context = True
show_column_numbers = True
pretty = True

# Same strictness as the root [tool.mypy] (INI has no include; tests_scripts/test_lint_type_scopes.py
# checks they agree), and no_implicit_reexport ON: this scope mocks nothing by reassignment.
strict = True
# a bare `# type: ignore` is itself an error, so no suppression hides its code
enable_error_code = ignore-without-code
# Not part of --strict; kept because both remain useful here.
no_implicit_optional = True
warn_unreachable = True
# On in all three passes (owner, 2026-09-28).
disallow_any_explicit = True

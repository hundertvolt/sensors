# mypy config for a SEPARATE, digital-twin-scoped type-check pass, run by scripts/typecheck.sh in
# addition to (not instead of) the main root pyproject.toml [tool.mypy] pass. Not folded into that
# single pass because mypy resolves each bare module name (`machine`/`network`/`neopixel`) to
# exactly one file per run - there is no per-importer resolution the way MICROPYPATH's real
# runtime ordering achieves it. `digital_twin/machine.py`/`network.py`/`neopixel.py` are therefore
# excluded from the main pass entirely (see pyproject.toml's own [tool.mypy] exclude comment for
# why even just *scanning* them there - without importing them anywhere - already collides with
# tests/machine.py's own bare top-level module name), which means the main pass can only ever
# check digital_twin/launch.py's and tests/test_digital_twin_*.py's own `import machine`/`network`
# call sites against the REAL board stub - not what those files actually need, since they exist
# specifically to exercise the twin's own richer API (`WDT.would_have_triggered_count`,
# `WLAN.script_connect_outcomes()`, `machine.configure_fram_state_path()`, ...) that the real board
# stub has no reason to declare. This second, isolated run points mypy_path at digital_twin/
# instead, the same "two resolution universes can't coexist in one run" isolation
# pyproject.toml's own [tool.mypy] mypy_path comment already establishes for typings/ vs. the dev
# venv's own packages - not a new kind of complexity, the same one applied a second time.
#
# Confirmed empirically (not assumed) before adding this file: plain `mypy` (root config, digital_twin
# excluded) has zero effect on src/'s own import resolution either way - the
# exclude list alone is sufficient to stop the project-wide hijack pyproject.toml's tests/network.py
# comment warns about, but it does NOT (contrary to a hope recorded in a prior session's own
# digital_twin/README.md "Known gaps" note) fix the digital-twin-specific attribute-resolution gap -
# hence this second pass actually closing it instead.
#
# mypy_path lists digital_twin before src: the one file
# that needs both universes at once, digital_twin/run_wozi_integration.py, imports sensortask_wozi
# (only resolvable via src/) alongside machine/network (must resolve to digital_twin/'s own richer
# twin API, never the real board stub - the whole point of this dedicated pass). No name collision
# between the two directories' own top-level modules (checked directly - src/ has no machine.py/
# network.py/neopixel.py of its own), and digital_twin listed first keeps it winning module-name
# resolution the same way it already needs to for its own files.
[mypy]
platform = linux
python_version = 3.10
follow_imports = silent
follow_imports_for_stubs = True
mypy_path = digital_twin:src:typings
custom_typeshed_dir = typings
no_site_packages = True
show_error_context = True
show_column_numbers = True
pretty = True

# Same strictness as the root [tool.mypy] section - kept in sync by hand since mypy has no
# "extends"/"include" directive for pulling shared settings from another config file.
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_return_any = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True
strict_equality = True

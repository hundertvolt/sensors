# Dev-tooling config (ruff, mypy, pytest, uv) for the sensors firmware repo. The shipped code is
# frozen bytecode, never an installable package; scope and rationale: CLAUDE.md's "Code quality
# tooling".
[project]
name = "sensors-tooling"
version = "0.1.0"
description = "Dev-tooling config for the sensors firmware repo (ruff/mypy/pytest/uv), not an installable package."
# >=3.11: scripts/typecheck.sh needs tomllib. At 3.10, `uv sync` once built a venv without it,
# surfacing as a raw traceback (typecheck.sh now also checks explicitly; setup_toolchain.py pins the
# same).
requires-python = ">=3.11"

[tool.uv]
package = false

[dependency-groups]
dev = [
    # PINNED, like every tool here: select = ["ALL"] and a zero-findings gate turn an unpinned
    # upgrade's new rule into a hard CI failure nobody chose. Bump deliberately, re-running lint.sh
    # and typecheck.sh.
    "mypy==2.3.1",
    "ruff==0.16.6",
    "pytest",
    "mpremote",
    # Stubs for pyserial (tests_hardware/harness.py; host_typecheck.ini has none otherwise). Pinned
    # like the tools: a stub release can change a signature and fail the gate.
    "types-pyserial==3.5.0.20260712",
    # shellcheck and actionlint ship their binaries in these wrappers, so every `uv sync` (and so
    # every setup_toolchain.py env tier) installs them. actionlint-py downloads its binary at
    # install time, so a fully offline sync lacks it.
    "shellcheck-py==0.11.0.1",
    "actionlint-py==1.7.12.24",
    # zizmor audits the workflows themselves (token scope, credential persistence, pinning); policy
    # in .github/zizmor.yml, pinned like the rest.
    "zizmor==1.30.1",
]

# The RPI_PICO_W MicroPython stubs are deliberately NOT a dependency group: they replace mypy's
# typeshed, which would break type-checking of this venv's own tools, so scripts/typecheck.sh
# installs them into typings/ (CLAUDE.md).

# Lint/type scope is the eight directories CLAUDE.md's "Code quality tooling" lists; the legacy tree
# (python/, modules/) is never in scope. tests_hardware/device_scripts/ joined after a driver
# signature change broke two unchecked scripts for a day.

[tool.ruff]
# py310, not the venv's 3.11: the syntax floor of the CHECKED code (MicroPython; PEP 604 unions),
# independent of the interpreter running ruff.
target-version = "py310"
# ruff format is never used - line breaks are hand-chosen (CLAUDE.md); 320 is ruff's own ceiling, so
# an accidental format run cannot rewrap.
line-length = 320
[tool.ruff.lint]
# ALL: an unconsidered rule defaults to enforced and a ruff bump surfaces new checks as findings, so
# every exclusion below is a justified decision. Preview rules stay off. This is why ruff is pinned.
select = ["ALL"]

# "×" is real content: bmp3xx's `# @web ... special:N="×N"` tags carry it into
# html/definitions/*.json's oversampling labels, which RUF003 would flag as an "x" look-alike.
allowed-confusables = ["×"]

ignore = [
    # ---- Hand-chosen line breaks (see [tool.ruff] above) ----
    "E501",  # line length - not enforced

    # One header block per module, per-function notes as # comments (CLAUDE.md, Part D.11): only the
    # docstring-PRESENCE rules are off; the STYLE rules (D200/D205/D209/D4xx) police the headers
    # that exist.
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",

    # ---- Impossible on the MicroPython target ----
    # No `pathlib` in the rp2 port at all, so every "use pathlib instead of os.path/open" finding
    # is unimplementable rather than merely unwanted.
    "PTH",
    # No async file I/O either: config_manager.py's flash writes have no non-blocking form. The
    # exposure is already structurally bounded - every real flash write is reachable only through
    # the REST PUT path (CLAUDE.md hard rule) - and SPECIFICATION.md Part F.3 records the finding.
    "ASYNC230",

    # ---- Wrong tool for this codebase ----
    # tests/ runs under the real MicroPython interpreter with microtest.py, not pytest (Part E.1),
    # so every PT rule reasons about fixtures that do not exist.
    "PT",
    # `print()` is the log transport, not debug residue - print_log.py is built on it.
    "T20",

    # ---- Would change runtime behavior, which a lint pass does not ----
    # asy_neopixel_driver.py's `while event.is_set(): await sleep(0)` is a yield handshake held
    # inside start_signal_lock; an Event would change the protocol.
    "ASYNC110",
    # `global` is how tests/ keeps its per-process port and scratch counters (one process per test
    # file); an object around one int buys nothing.
    "PLW0603",

    # ---- Mandated by this project's own shared-primitive spec ----
    # Part G.2 REQUIRES `except Exception` -> err_s() -> "Failed" around a caller-supplied callback,
    # which may raise anything.
    "BLE001",

    # ---- Cost without a defect caught, on a 264KB-SRAM target ----
    # TRY003/EM101/EM102 add exception classes and locals on the error path for no behavioral gain
    # (Part D.4).
    "TRY003", "EM101", "EM102",
    # contextlib.suppress costs an import and a context-manager allocation per use, and contextlib
    # is not in the frozen build.
    "SIM105",

    # ---- The "fix" would itself be a behavior change ----
    # PERF203: `for x: try: ... except: log` degrades ONE iteration and carries on, Part I's
    # catch->degrade ladder; hoisting aborts the loop.
    "PERF203",
    # S110 wants a log call at sites that are deliberately silent; its other escape,
    # contextlib.suppress, is ruled out above.
    "S110",

    # ---- Not expressible on the target runtime ----
    # RUF005's `(*a, b)`: MicroPython has no PEP 448 unpacking in displays - `[*a, 3]` is a
    # SyntaxError on the pinned interpreter (verified).
    "RUF005",
    # RUF037's `deque(maxlen=N)`: MicroPython's deque takes no keyword arguments (TypeError,
    # verified); the positional form is the only one that runs.
    "RUF037",
    # RUF012 wants an unquoted ClassVar, which trips TC004's runtime `from typing import ClassVar`,
    # and neither typing nor __future__ exists at runtime: unsatisfiable together.
    "RUF012",

    # PYI024: typing.NamedTuple is a RUNTIME base class, and typing is not importable on MicroPython
    # (Part D.6), so collections.namedtuple stays.
    "PYI024",

    # ---- Stub-file conventions that are wrong for runtime code ----
    # PYI041: `int | float` is load-bearing - every `_push_*` callback tests `type(value) is not
    # int` at runtime, and the six-member family shares one shape (D.10).
    "PYI041",
    # PYI034: typing.Self is gated behind 3.11 in the stubs while the checked code's floor is 3.10,
    # and the @final escape needs a runtime typing import.
    "PYI034",

    # ---- More "the fix would itself be a behavior change" ----
    # TRY301: an inner raise function is a closure allocation on a firmware error path (D.4); in the
    # SPI tests the raise IS what is under test.
    "TRY301",
    # SIM115: `with open(...)` would newly swallow an OSError during read/close that propagates
    # today.
    "SIM115",
    # PLW1641 would make RunConfig hashable; it is unhashable in both runtimes and nothing hashes
    # it.
    "PLW1641",

    # ---- Not expressible on the target runtime (continued) ----
    # FURB122's `f.writelines()` does not exist on MicroPython file objects (AttributeError,
    # verified on the pinned interpreter).
    "FURB122",

    # ---- Polices call sites into APIs this project does not own ----
    # FBT001/002 stay on: our own boolean parameters are keyword-only. FBT003's remaining calls are
    # into C entry points that reject keywords, e.g. `wlan.active(True)`.
    "FBT003",

    # ---- Deliberate, documented idiom ----
    # `x != x` is asy_scd30_driver.py's NaN test in its two setters, commented at both sites; either
    # spelling works there.
    "PLR0124",

    # ---- Documented accepted risk, decided by the project owner ----
    # The webserver binds 0.0.0.0 deliberately.
    "S104",
    # S105/S106 stay ON globally: CLAUDE.md's no-credentials rule needs them to catch a NEW one. The
    # three known, accepted sites are exempted per file below.

    # ---- Identifiers deliberately mirror the datasheet / reference algorithm ----
    # Part D.1/C.2: BMP3xx's T1/P1..P11 as printed in BST-BMP388-DS001 9.2/9.3, the VOC algorithm's
    # L/X0/K, CO2, and C.2's acronym class names.
    "N801",  # class name (SGP40_I2C, CRC8, VOC_Algorithm)
    "N802",  # function name (get_CO2)
    "N803",  # argument name (L, X0, K)
    "N806",  # variable in function (T1..T3, P1..P11)
    "N811",  # constant imported as non-constant (`from machine import I2C as FakeI2C`)
    "N814",  # camelcase imported as constant (same acronym-vs-constant ambiguity)

    # ---- Would push module headers past CLAUDE.md's 3-line cap ----
    # D205/D209 each ADD a line to a header already at the cap; D200 and D4xx, which add none, stay
    # on.
    "D205", "D209",

    # ---- Layout the frozen build requires ----
    # src/ and ext/ are frozen flat into one directory (CLAUDE.md), so no packages and no
    # __init__.py by design.
    "INP001",

    # ---- Contradicts CLAUDE.md's own documentation rule (continued) ----
    # CPY001: no file carries a copyright notice by design - one 3-line header per module,
    # attribution in THIRD_PARTY_LICENSES.md.
    "CPY001",
]

# D203/D211 and D212/D213 are mutually exclusive pairs; picking a convention resolves each pair
# rather than leaving `ALL` to enable both halves of both conflicts.
[tool.ruff.lint.pydocstyle]
convention = "google"

# Ceilings sit at the measured maximum, so they gate regression without forcing a rewrite; ratchet
# DOWN only. max-args 24 is WebserverService's keyword-defaulted wiring, raised one reviewed
# parameter at a time (L.7, H.7, I.3).
[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pylint]
max-args = 24
max-branches = 20
max-statements = 80
max-returns = 12

# Per-file exemptions live HERE, centrally and with a reason, never as scattered `# noqa` (owner's
# direction: enable the strict rule, don't paper over it). Each is a property of what the file IS.
[tool.ruff.lint.per-file-ignores]
# Test code asserts, reaches into privates under test, imports lazily after sys.path setup (Part
# E.3), and asserts literal expected values.
#
# ARG00x: a double must accept the real API's full signature, and mypy checks Protocol and
# monkeypatch parameter NAMES, so `_buf` is a hard error. Every ARG finding here is that pattern;
# src/ has none.
"tests/**" = ["S101", "SLF001", "PLC0415", "PLR2004", "ARG001", "ARG002", "ARG004", "ARG005"]
"digital_twin/**" = ["S101", "SLF001", "PLC0415", "PLR2004"]
# tests_scripts/ and tests_hardware/ are test suites with the same properties, so the same set. S603
# on top for tests_scripts/: running the repo's own scripts as subprocesses IS what it verifies,
# every argv in-repo.
"tests_scripts/**" = ["S101", "SLF001", "PLC0415", "PLR2004", "ARG001", "ARG002", "ARG004", "ARG005", "S603"]
"tests_hardware/**" = ["S101", "SLF001", "PLC0415", "PLR2004", "ARG001", "ARG002", "ARG004", "ARG005"]
# api_response.py calls a reader's `_set_dict_cfg` across objects by design: Part C.5.2 publishes
# that setter-dispatch contract by name.
"src/api_response.py" = ["SLF001"]
# S106 below marks one of the three KNOWN, accepted hardcoded-credential sites (CLAUDE.md: the
# hotspot fallback password, not to be rotated without the owner); exempted per file so S105/S106
# still catch a new one anywhere else.
#
# The machine fakes mirror MicroPython's own constructors, whose parameter really is `id` upstream,
# and I2C writeto()/readfrom_into()'s positional-only `stop` (extmod/machine_i2c.c rejects kwargs):
# a faithful double must match.
"tests/machine.py" = ["A002", "FBT001", "FBT002", "ANN401"]  # ANN401: category 1 above - Timer.__init__ forwards **kwargs into self.init()
# ANN401: _build_i2c_chip() returns Any on purpose - no single chip fake implements every _I2CDevice
# method (see that function's comment).
"digital_twin/machine.py" = ["A002", "FBT001", "FBT002", "ANN401"]
# Same faithful-double reasoning: test_setup_toolchain_env.py's fake_run() doubles must accept
# setup_toolchain.run()'s signature exactly, positional `check=True` included; its own helpers stay
# keyword-only.
"tests_scripts/test_setup_toolchain_env.py" = ["FBT001", "FBT002"]
# The `_push_*` dispatch family takes the config-VALUE union, where bool is a JSON value, not a
# flag, through Part C.5.2's single-positional-argument contract that D.10 forbids splitting.
"src/asy_bmp3xx_driver.py" = ["FBT001"]
"src/asy_scd30_driver.py" = ["FBT001"]
"src/asy_wifi_service.py" = ["S106", "FBT001"]
# ANN401, category 1 - heterogeneous **kwargs forwarded into a callee whose keywords have DIFFERENT
# types (print()'s sep/end/file/flush; constructors with up to 21 keywords): object, str and str |
# None all fail at 3.10-3.12.
#
# PEP 692's Unpack[TypedDict] is the real fix and unavailable: typings/' typing.pyi declares
# TypedDict as a plain object.
"src/print_log.py" = ["ANN401"]
"tests/test_asy_uart_driver.py" = ["ANN401"]
"tests/test_asy_uart_comm.py" = ["ANN401"]
"tests/_uart_comm_harness.py" = ["ANN401"]
"tests/test_asy_webserver_service.py" = ["ANN401"]
# ANN401, category 2 - the asyncio.start_server() callback seam: MicroPython has ONE Stream for both
# directions and CPython's StreamWriter has no aclose(), so no annotation fits both; everything past
# _serve() is typed.
#
# ANN401, category 3 - `_wlan` bridges the real WLAN board stub and tests/network.py's fake for
# fake-only attributes; a three-file family (D.10), change all three or none.
"tests/test_asy_wifi_service.py" = ["ANN401"]
"tests/test_ntp_fram_system_integration.py" = ["ANN401"]
"tests/test_ntp_wifi_dns_integration.py" = ["ANN401"]
# ANN401, category 4 - this test deliberately passes a TYPE-INVALID value to prove the runtime
# degrades cleanly. Typing the parameter honestly would make the call site a static error, which is
# the very thing the test exists to exercise.
"tests/test_asy_udp_socket.py" = ["ANN401"]
# ANN401, category 5 - driver-agnostic fan-in seams (the `_ValueSource` Protocol, C.14/L.6.3): every
# reader's get_data() returns its own NamedTuple, so no single element type fits every producer.
#
# ARG002: _DefaultSignalSink.request_signal() is a no-op sink whose signature mirrors
# NeopixelDriver's exactly, so codegen needs no special case.
"src/asy_notification_service.py" = ["ANN401", "ARG002"]
"src/asy_sgp40_driver.py" = ["ANN401", "FBT001"]
"tests/test_asy_sgp40_driver.py" = ["ANN401"]
"tests/test_notification_scd30_sgp40_integration.py" = ["ANN401"]
"tests/test_notification_sgp40_integration.py" = ["ANN401"]
"tests/test_setter_microdot_integration.py" = ["ANN401"]
# ANN401, category 5 again: I2CHazardAdapter's callables each take one real driver instance,
# genericness across the whole I2C_HAZARD_CATALOG being the point.
"tests/_bus_hazard_catalog.py" = ["ANN401"]
# ANN401, category 6 - a dynamically __import__()ed module (a device's sensortask_<device>, or the
# twin's machine module) has no static type; ModuleType would reject every attribute these files
# need.
"digital_twin/run_generic_integration.py" = ["ANN401"]
"tests_scripts/test_buildgen_twin_wiring.py" = ["ANN401"]
"tests/_webserver_concurrency_scenarios.py" = ["ANN401"]
# Category 6 too: the shared per-device scenario library imports whichever device's sensortask
# module a parametrized scenario boots (L.4).
"tests/_sensortask_scenarios.py" = ["ANN401"]
# Category 6 too, for the construction scenarios split out of
# test_digital_twin_sensortask_integration.py, whose remaining wozi-only tests import statically and
# need no exemption.
"tests/_digital_twin_construction_scenarios.py" = ["ANN401"]
"digital_twin/launch.py" = ["S105"]
"tests/test_digital_twin_network_neopixel.py" = ["S106"]
# asy_webserver_service.py makes the same documented Part C.5.2 `_set_dict_cfg` dispatch call as
# api_response.py above, and asserts its static mount is non-None purely to narrow the type for
# mypy (the route is only ever registered when it isn't None).
"src/asy_webserver_service.py" = ["SLF001", "S101", "ANN401"]  # ANN401: the asyncio.start_server() seam described above
"digital_twin/_http_client.py" = ["ANN401"]  # ANN401: category 2 above, the reader-side half of the same one-Stream-for-both-directions seam - readinto() has no clean non-Any type either
# S603 (untrusted subprocess input) has no satisfiable form for a build driver: build_firmware.py's
# one call runs the repo's own build_website.sh by absolute path, shell=False. The rule stays live
# everywhere else.
"scripts/build_firmware.py" = ["S603"]
# Same for _digital_twin_ci_suite.py: it spawns the Unix-port interpreter on the repo's own
# run_generic_integration.py, argv built from its own constants and flags.
"scripts/_digital_twin_ci_suite.py" = ["S603"]
# setup_toolchain.py IS a subprocess driver (git, apt, make, nmcli). run() takes an argv list, never
# a shell string, built from repo constants plus the installer's own versions.toml/CLI input.
"toolchain/setup_toolchain.py" = ["S603"]
# Same for the lwIP override's post-build check: `-E` only, with the argv CMake recorded in the real
# build's flags.make.
"toolchain/micropython_overrides.py" = ["S603"]
# ---- tests_hardware/ (real-hardware tier) ----
# S603/S607: shelling out to mpremote/picotool/nmcli/iw/iptables/tc IS this tier's job, argv from
# repo constants and the serial path; tools resolve from PATH, where setup_toolchain.py puts them.
"tests_hardware/harness.py" = ["S603", "S607"]
"tests_hardware/bench_control.py" = ["S603", "S607"]
"tests_hardware/flash/test_toolchain_flash_boot.py" = ["S603", "S607"]
"tests_hardware/manual/manual_toolchain.py" = ["S603", "S607"]
# S310: a fixed `http://` URL this module builds itself from a bench-LAN host/port pair, so the
# `file:`/custom-scheme exposure the rule warns about is unreachable - there is no attacker-supplied
# scheme to audit.
"tests_hardware/http_client.py" = ["S310"]
# S112: injected packet loss makes individual request failures the fault itself; the assertions are
# about torn reads, and logging each would drown the finding.
"tests_hardware/bench/test_bus_concurrency_under_api_load.py" = ["S112"]
# S105/S106: tests that join the DUT's hotspot must know its accepted fallback password (see
# asy_wifi_service.py above) - copies of an accepted risk, exempted per file.
"tests_hardware/conftest.py" = ["S105"]
"tests_hardware/bench/test_hotspot_role_reversal.py" = ["S105"]
"tests_hardware/bench/test_network_resilience.py" = ["S105"]
"tests_hardware/device_scripts/wifi_reconnect_after_failed_attempts_repro.py" = ["S106"]
# S105: same "copy of an accepted risk, not a new credential" reasoning as the tests_hardware/
# entries above, for buildgen's own [device].hotspot_password minimum-length boundary test - it
# has to assert against the real WPA2 8-character floor literal, not a placeholder.
"tests_scripts/test_buildgen_validate.py" = ["S105"]
# RUF007: device_scripts/ is MicroPython firmware-target code uploaded to the board and run there
# (see tests_hardware/README.md) - `itertools` does not exist in the rp2 port at all, so
# `itertools.pairwise()` is unimplementable, exactly like the global RUF005/RUF037/FURB122 entries.
"tests_hardware/device_scripts/**" = ["RUF007"]

[tool.mypy]
# The micropython-stubs project's documented setup: typings/ replaces mypy's typeshed so
# MicroPython's own signatures win, and adds the board modules (SPECIFICATION.md B.15).
platform = "linux"
python_version = "3.10"  # same reasoning as [tool.ruff]'s target-version above - the checked
# code's syntax floor (MicroPython/PEP 604), not the interpreter mypy itself runs under
follow_imports = "silent"
# Extends `silent` to the (upstream-Beta) stub package itself: its types are used, its own issues
# not reported.
follow_imports_for_stubs = true
# build/generated_src for device_scripts' one static `import sensortask_dev`; typecheck.sh generates
# it first (B.15).
mypy_path = ["typings", "src", "build/generated_src"]
custom_typeshed_dir = "typings"
# Keeps the venv's own packages out: they need the real stdlib, not typings/' MicroPython subset.
no_site_packages = true
# A bare glob in `files` (e.g. "src/*.py") gets pre-expanded to an explicit file list, which
# `exclude` can't then prune - passing the directory itself is what makes `exclude` actually take
# effect during mypy's own directory walk.
files = ["src", "tests", "digital_twin", "tests_hardware/device_scripts"]
# Excluded, each for a reason B.15 states: tests/network.py would hijack the real `network` stub
# project-wide; the twin's fakes collide with tests/machine.py; the rest need the twin's own API, so
# digital_twin/typecheck.ini checks them.
exclude = [
    "tests/network\\.py$",
    "digital_twin/machine\\.py$",
    "digital_twin/network\\.py$",
    "digital_twin/neopixel\\.py$",
    "digital_twin/launch\\.py$",
    "digital_twin/run_generic_integration\\.py$",
    "digital_twin/segfault_stress_repro\\.py$",
    "tests/test_digital_twin_.*\\.py$",
    # Shared twin scenario libraries (leading underscore, so the glob above misses them), same
    # reason.
    "tests/_webserver_concurrency_scenarios\\.py$",
    # Same exception, same reason, one file over: tests/_digital_twin_construction_scenarios.py
    # (imported by six tests/test_digital_twin_construction_<device>.py files).
    "tests/_digital_twin_construction_scenarios\\.py$",
]

show_error_context = true
show_column_numbers = true
pretty = true

# Full --strict, spelled `strict` so a mypy bump surfaces new strict checks; `assignment` is
# deliberately not disabled. The one exemption follows (B.15, CLAUDE.md).
strict = true
# Not part of --strict; kept from the pre-strict config because both remain useful here.
no_implicit_optional = true
warn_unreachable = true
# no_implicit_reexport stays off here only: tests/ mock by reassigning a module's imported names (no
# unittest.mock on MicroPython), which would need 175 inline ignores. The other two passes enforce
# it (CLAUDE.md).
no_implicit_reexport = false

[[tool.mypy.overrides]]
# Vendored, unannotated microdot's @app.get()/@app.put() make every handler "untyped" under
# --strict; this is the one file registering real routes (CLAUDE.md). Revisit if Microdot ships
# hints.
module = "test_setter_microdot_integration"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
# pytest runs tests_scripts/ only, the host build chain's CPython suite; tests/ runs under the real
# MicroPython interpreter via scripts/test.sh (Part E.1).
testpaths = ["tests_scripts"]

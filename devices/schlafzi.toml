# schlafzi.toml - one of the three "ArZi neu" units (BUILD_CHAIN_PLAN.md's own device-list note):
# currently identical hardware to klkizi/grkizi and to arzi's own sensor set (no BMP3xx), but a
# different bus/pin layout from arzi - given its own independent TOML file since future hardware
# divergence between the three "neu" units is expected. Wiring facts sourced directly from
# modules/sensortask-neu.py (still on the old, pre-refactor asy_i2c_driver.py/asy_FRAM_manager -
# read for its wiring facts only, same as a datasheet, per this initiative's priming instructions;
# not a coding style reference, not edited).

[device]
name = "Schlafzi"
hostname = "SensorStationSchlafzi"
hotspot_password = "12345678"

# Mandatory infrastructure tuning - wifi/ntp/system are never modeled as [[instance]] entries
# (every buildable device has them, unconditionally; the TOML models optional modules only -
# BUILD_CHAIN_PLAN.md's own schema decision, 2026-09-09). Required, not defaulted: a device TOML
# missing either field below is a build-time error, same fail-loud contract as everything else in
# this file (tests_scripts/test_device_tomls.py's check_system_config_present_and_valid enforces
# this by hand until Session 3's generator exists). modules/sensortask-neu.py:
# `conn = asy_conn_time(..., conn_fail_to_hotspot=5, hotspot_time_min=8, ...)`.
[system_config]
conn_fail_to_hotspot = 5
hotspot_time_min = 8

# SCD30 lives on i2c0 here (modules/sensortask-neu.py: `i2c0 = asy_i2c_driver.I2C(0, 13, 12,
# ...)`, `scd_reader = SCD30_Reader(i2c0, 8, ...)`) - same i2c0/i2c1 pin pair as arzi's own layout.
# timeout=200000 (200ms): same SCD30-datasheet clock-stretch headroom as wozi/dev/arzi's own SCD30
# bus (datasheets/scd30/..._Interface_Description.pdf p.2) - not present in the legacy file itself
# since the old, pre-refactor asy_i2c_driver.py never had a timeout parameter at all (see
# devices/arzi.toml's own comment for the confirmed detail); src/asy_i2c_driver.py (what these
# TOML files target) does support it, so this applies the same real chip fact already established
# for wozi/dev/arzi.
[bus.i2c0]
scl_pin = 13
sda_pin = 12
frequency = 50000
timeout = 200000

# SGP40 lives alone on this bus here (modules/sensortask-neu.py: `i2c1 = asy_i2c_driver.I2C(1, 27,
# 26, ...)`) - no BMP3xx at all (confirmed directly: no BMP3xx import/construction anywhere in
# modules/sensortask-neu.py, only SCD30 + SGP40 + Neopixel + FRAM + the singleton services).
[bus.i2c1]
scl_pin = 27
sda_pin = 26
frequency = 50000

# Different from arzi's own spi0 (sck=2/mosi=3/miso=4) - modules/sensortask-neu.py:
# `spi0 = asy_spi_driver.SPI(0, 18, 19, 16)`.
[bus.spi0]
sck_pin = 18
mosi_pin = 19
miso_pin = 16

# --- sensor drivers ---------------------------------------------------------------------------

[[instance]]
driver = "scd30"
name_ext = ""
bus = "i2c0"
irq_pin = 8
trigger_sec = 3

[[instance]]
driver = "sgp40"
name_ext = ""
bus = "i2c1"

[instance.wiring]
comp_source = "scd30"

# No bmp3xx instance - the "neu" family has no BMP3xx (see [bus.i2c1] comment above).

# --- singleton services ------------------------------------------------------------------------

[[instance]]
driver = "fram"
bus = "spi0"
# CS = GPIO17 here (arzi's own CS is GPIO1 - a different pin, not a copy-paste of arzi's value;
# see BUILD_CHAIN_PLAN.md's own priming note on this) - modules/sensortask-neu.py:
# `fram = asy_FRAM_manager(spi0, 17, max_size=0x2000, ...)`.
cs_pin = 17
max_size = 0x2000

[[instance]]
driver = "neopixel"
pin = 15

[[instance]]
driver = "notification"

# Explicit, TOML-visible wiring - today notification always drives the neopixel instance (currently
# a hardcoded `pixel.request_signal` constructor argument in build_system(), not resolved via
# _WIRING at all). Generator-side resolution isn't settled yet - see BUILD_CHAIN_PLAN.md's own
# schema section for why (NotificationCoordinator wants pixel.request_signal specifically, not the
# whole NeopixelDriver instance _WIRING's documented contract would hand it).
[instance.wiring]
signal_sink = "neopixel"

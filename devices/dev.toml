# dev.toml - bench rig device config; the only unit ever bench-flashed, never wozi's own pins
# (CLAUDE.md's "Per-variant sensortask-*.py generator" rule).
# Wiring originally sourced from the hand-written src/sensortask_dev.py's build_system(), since
# retired (BUILD_CHAIN_PLAN.md's Session 6) - this file is now the source of truth buildgen reads
# from, not the other way around.

[device]
name = "Dev"
hostname = "SensorStationDev"
hotspot_password = "12345678"
# Mandatory infra (wifi/ntp/system) tuning - required, not modeled as [[instance]] entries.
conn_fail_to_hotspot = 5
hotspot_time_min = 8

# Mandatory-infra-to-instance links; each field optional, absence disables that feature.
[device.wiring]
led_target = "neopixel"
fram_target = "fram"

[bus.i2c0]
scl_pin = 13
sda_pin = 12
frequency = 50000

# SCD30 clock-stretch headroom (datasheet: up to 150ms/day, past rp2's 50ms default).
[bus.i2c1]
scl_pin = 15
sda_pin = 14
frequency = 50000
timeout = 200000

[bus.spi0]
sck_pin = 2
mosi_pin = 3
miso_pin = 4

# The bench's permanent UART0<->UART1 crossover jumper (GP0<->GP9, GP1<->GP8 - dev_legacy/README.md)
# makes SPECIFICATION.md Part J.7's self-compatibility property physically testable. rxbuf/txbuf/
# poll_wait_ms/poll_idle_ms: sized from the real frame (5 + 48 = 53 bytes) and this bench's own
# poll rate, not left at asy_uart_driver.UART's own generic defaults - see Part J.6.
[bus.uart0]
tx_pin = 0
rx_pin = 1
baudrate = 115200
rxbuf = 512
txbuf = 512
poll_wait_ms = 2
poll_idle_ms = 50

[bus.uart1]
tx_pin = 8
rx_pin = 9
baudrate = 115200
rxbuf = 512
txbuf = 512
poll_wait_ms = 2
poll_idle_ms = 50

# --- sensor drivers ---------------------------------------------------------------------------

[[instance]]
driver = "scd30"
name_ext = ""
bus = "i2c1"
irq_pin = 11
trigger_sec = 3

[instance.wiring]
fram_target = "fram"

[[instance]]
driver = "sgp40"
name_ext = ""
bus = "i2c1"

[instance.wiring]
fram_target = "fram"

[instance.wiring.temperature_source]
source = "scd30"
field = "Temp"

[instance.wiring.humidity_source]
source = "scd30"
field = "Hum"

[[instance]]
driver = "bmp3xx"
name_ext = ""
bus = "i2c0"
address = 0x77

[instance.wiring]
fram_target = "fram"

# ISL29125: real dev-board wiring (i2c1, GPIO6 IRQ), bench-validated on main - see
# ISL29125_BUILDGEN_MIGRATION_REQUIREMENTS.md. Placed last among the sensor drivers (FRAM
# chunk-order consequence, SPECIFICATION.md Part A.7's bump-pointer allocator) - no "stay
# byte-identical to wozi" constraint applies here since wozi never gets this instance at all.
# irq_pull_up = false: this board carries its own external pull-up resistor on GPIO6, so the
# internal one (the driver's own default) stays off rather than also engaging alongside it.
[[instance]]
driver = "isl29125"
name_ext = ""
bus = "i2c1"
irq_pin = 6
irq_pull_up = false

[instance.wiring]
fram_target = "fram"

# --- singleton services ------------------------------------------------------------------------

[[instance]]
driver = "fram"
bus = "spi0"
cs_pin = 5
# MB85RS2MTA, 256KB.
max_size = 0x40000

[[instance]]
driver = "neopixel"
pin = 18

[instance.wiring]
fram_target = "fram"

[[instance]]
driver = "notification"

[instance.wiring]
signal_sink = "neopixel"
fram_target = "fram"

# Per-signal getters - each optional; absence disables that specific warning signal.
[instance.wiring.warn_co2]
source = "scd30"
field = "CO2"

[instance.wiring.warn_voc]
source = "sgp40"
field = "VOC"

[instance.wiring.warn_hum]
source = "scd30"
field = "Hum"

# --- UART crossover link exerciser (bench-only) -------------------------------------------------
# Each end gets its own FRAM-backed error/warning log (UartLinkExerciser's inner UART_Comm already
# supports this, SPECIFICATION.md Part J.9/C.14) - kept as two separate chunks, one per end, rather
# than a logger_target reach-through onto the other end: a shared history would merge both ends'
# faults into one /status entry and make a fault unattributable to a single end (see
# tests/test_digital_twin_uart_link.py's own distinct-loggers test). wozi never gets a UART
# instance - it is never physically flashed, so wiring it there would add an untestable peripheral
# (CLAUDE.md). Placed last in this file's own construction order (after every other FRAM-consuming
# instance), so these two new chunks only ever append to dev's on-chip layout, never shift one
# already allocated to an earlier module (SPECIFICATION.md Part A.7's bump-pointer allocator).

[[instance]]
driver = "uart_link"
name_ext = "init"
bus = "uart0"
role = "initiator"

[instance.wiring]
fram_target = "fram"

[[instance]]
driver = "uart_link"
name_ext = "resp"
bus = "uart1"
role = "responder"

[instance.wiring]
fram_target = "fram"

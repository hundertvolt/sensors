# dev.toml - the bench rig only (never validates wozi's own hardcoded pins - CLAUDE.md's "Per-variant
# sensortask-*.py generator" hard rule). Wiring facts sourced directly from
# src/sensortask_dev.py's own build_system() (BUILD_CHAIN_PLAN.md Session 2).

[device]
name = "Dev"
hostname = "SensorStationDev"
hotspot_password = "12345678"

# Mandatory infrastructure tuning - wifi/ntp/system are never modeled as [[instance]] entries
# (every buildable device has them, unconditionally; the TOML models optional modules only -
# BUILD_CHAIN_PLAN.md's own schema decision, 2026-09-09). Required, not defaulted: a device TOML
# missing either field below is a build-time error, same fail-loud contract as everything else in
# this file (tests_scripts/test_device_tomls.py's check_system_config_present_and_valid enforces
# this by hand until Session 3's generator exists). src/sensortask_dev.py:
# `conn = AsyWifiService(..., conn_fail_to_hotspot=5, hotspot_time_min=8, ...)`.
[system_config]
conn_fail_to_hotspot = 5
hotspot_time_min = 8

# Mandatory-infra-to-optional-instance wiring (project owner's direction, 2026-09-09) - both
# optional, absence disables the feature rather than erroring, same treatment as every
# [instance.wiring] getter. led_target: src/sensortask_dev.py's `conn.set_ext_led(pixel)` (WiFi
# status indication on the neopixel). fram_target: `sysfunct = SystemService(..., fram=fram, ...)`
# (SystemService's own error log). Mandatory-to-mandatory links (e.g. NTP's/SystemService's own
# dependency on WiFi) are never wired here - both endpoints always exist unconditionally on every
# device, so there's no real presence-or-absence choice to encode, unlike these two.
[system_config.wiring]
led_target = "neopixel"
fram_target = "fram"

# BMP3xx sits alone on i2c0 here (src/sensortask_dev.py: `i2c0 = asy_i2c_driver.I2C(0, 13, 12,
# ...)`) - reverse of wozi's own bus pairing, deliberate (SPECIFICATION.md Part C.8's bus-hazard
# cross-device-interleaving concern). No SCD30 on this bus, so no clock-stretch timeout override
# needed - port default (50ms) is fine for BMP3xx.
[bus.i2c0]
scl_pin = 13
sda_pin = 12
frequency = 50000

# SCD30 + SGP40 share this bus here (src/sensortask_dev.py: `i2c1 = asy_i2c_driver.I2C(1, 15, 14,
# ...)`). timeout=200000 (200ms): same SCD30-datasheet-driven clock-stretch headroom as wozi's own
# i2c0 (datasheets/scd30/..._Interface_Description.pdf p.2), just on the other bus here.
[bus.i2c1]
scl_pin = 15
sda_pin = 14
frequency = 50000
timeout = 200000

[bus.spi0]
sck_pin = 2
mosi_pin = 3
miso_pin = 4

# --- sensor drivers ---------------------------------------------------------------------------

[[instance]]
driver = "scd30"
name_ext = ""
bus = "i2c1"
# IRQ/RDY = GPIO11 on this bench unit (wozi: GPIO8) - src/sensortask_dev.py:
# `scd_reader = SCD30_Reader(i2c1, 11, ...)`.
irq_pin = 11
trigger_sec = 3

# fram_target - optional, absence disables this instance's own FRAM-backed error log (falls back
# to a plain in-RAM PrintLog) rather than being a build error. src/sensortask_dev.py:
# `scd_reader = SCD30_Reader(..., fram=fram, ...)`.
[instance.wiring]
fram_target = "fram"

[[instance]]
driver = "sgp40"
name_ext = ""
bus = "i2c1"

[instance.wiring]
comp_source = "scd30"
# fram_target - optional, same as scd30's own above. src/sensortask_dev.py:
# `sgp_reader = SGP40_Reader(..., fram_storage=fram, ...)` - also covers its VOC backup chunk, not
# just its error log.
fram_target = "fram"

[[instance]]
driver = "bmp3xx"
name_ext = ""
bus = "i2c0"
# BMP3xx_Reader's own default (src/asy_bmp3xx_driver.py: `address: int = 0x77`) - neither
# sensortask_dev.py's own BMP3xx_Reader(...) call passes an explicit address, so 0x77 applies here
# too (datasheets/bmp3xx/ - SDO-strapping-selectable, same value as wozi's own unit).
address = 0x77

# fram_target - optional, same treatment as scd30/sgp40 above. src/sensortask_dev.py:
# `bmp_reader = BMP3xx_Reader(..., fram=fram, ...)`.
[instance.wiring]
fram_target = "fram"

# --- singleton services ------------------------------------------------------------------------

[[instance]]
driver = "fram"
bus = "spi0"
cs_pin = 5
# MB85RS2MTA, 256KB (src/sensortask_dev.py: `fram = AsyFramManager(spi0, 5, max_size=0x40000,
# ...)`) - a real per-chip fact, not wozi's own 8KB chip.
max_size = 0x40000

[[instance]]
driver = "neopixel"
# GPIO18 on this bench unit (wozi: GPIO15) - src/sensortask_dev.py: `pixel = NeopixelDriver(18,
# ...)`.
pin = 18

# fram_target - optional, same treatment as scd30/sgp40/bmp3xx above. src/sensortask_dev.py:
# `pixel = NeopixelDriver(18, fram=fram, ...)`.
[instance.wiring]
fram_target = "fram"

[[instance]]
driver = "notification"

# Explicit, TOML-visible wiring - today notification always drives the neopixel instance (currently
# a hardcoded `pixel.request_signal` constructor argument in build_system(), not resolved via
# _WIRING at all). Generator-side resolution isn't settled yet - see BUILD_CHAIN_PLAN.md's own
# schema section for why (NotificationCoordinator wants pixel.request_signal specifically, not the
# whole NeopixelDriver instance _WIRING's documented contract would hand it).
[instance.wiring]
signal_sink = "neopixel"
# fram_target - optional, same treatment as every other instance above. src/sensortask_dev.py:
# `notify_service = NotificationCoordinator(..., fram=fram, ...)`.
fram_target = "fram"

# Per-signal getters - optional (BUILD_CHAIN_PLAN.md's "Device TOML schema"): a device TOML may
# omit any of these three, which disables that specific warning signal on this device rather than
# being a build error. src/sensortask_dev.py: `notify_service.register(NotificationSignal(
# "WarnCO2", scd_reader, "CO2", ...))` / `("WarnVOC", sgp_reader, "VOC", ...)` /
# `("WarnHum", scd_reader, "Hum", ...)`.
[instance.wiring.warn_co2]
source = "scd30"
field = "CO2"

[instance.wiring.warn_voc]
source = "sgp40"
field = "VOC"

[instance.wiring.warn_hum]
source = "scd30"
field = "Hum"

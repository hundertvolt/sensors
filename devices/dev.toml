# dev.toml - the bench rig, the only unit ever flashed; always built from this file, never from
# wozi's pins (CLAUDE.md's WoZi rule). The source of truth buildgen reads (SPECIFICATION.md Part L).

[device]
name = "Dev"
hostname = "SensorStationDev"
hotspot_password = "12345678"
# Mandatory infra (wifi/ntp/system) tuning - required, not modeled as [[instance]] entries.
conn_fail_to_hotspot = 5
hotspot_time_min = 8
# Simultaneous-connection admission ceiling, kept below the firmware's own lwIP
# MEMP_NUM_TCP_PCB (toolchain/versions.toml) with margin - SPECIFICATION.md Part H.7. backlog
# is omitted, so it derives max_connections + 1 - already the deepest queue buildgen allows.
# 5, not 6: the MQTT client's held connection takes the sixth (owner, 2026-10-07: 'Web connections 6->5').
max_connections = 5

# Mandatory-infra-to-instance links; each field optional, absence disables that feature.
[device.wiring]
led_target = "neopixel"
fram_target = "fram"

[bus.i2c0]
scl_pin = 13
sda_pin = 12
frequency = 50000

# SCD30 clock-stretch headroom (datasheet: up to 150ms/day, past rp2's 50ms default).
[bus.i2c1]
scl_pin = 15
sda_pin = 14
frequency = 50000
timeout = 200000

[bus.spi0]
sck_pin = 2
mosi_pin = 3
miso_pin = 4

# The bench's UART0<->UART1 crossover jumper (GP0<->GP9, GP1<->GP8; tests_hardware/README.md
# 'The dev bench') makes Part J.7's self-compatibility testable. Buffers fit the real 53-byte
# frame (J.6); the poll rates equal the driver defaults, stated so the build checks read them here.
[bus.uart0]
tx_pin = 0
rx_pin = 1
baudrate = 115200
# @tunable dev.uart_rxbuf = 512
rxbuf = 512
# @tunable dev.uart_txbuf = 512
txbuf = 512
# @tunable dev.uart_poll_wait_ms = 2
poll_wait_ms = 2
# @tunable dev.uart_poll_idle_ms = 50
poll_idle_ms = 50

[bus.uart1]
tx_pin = 8
rx_pin = 9
baudrate = 115200
# @tunable dev.uart_rxbuf = 512
rxbuf = 512
# @tunable dev.uart_txbuf = 512
txbuf = 512
# @tunable dev.uart_poll_wait_ms = 2
poll_wait_ms = 2
# @tunable dev.uart_poll_idle_ms = 50
poll_idle_ms = 50

# --- sensor drivers ---------------------------------------------------------------------------

[[instance]]
driver = "scd30"
name_ext = ""
bus = "i2c1"
irq_pin = 11
trigger_s = 3

[instance.wiring]
fram_target = "fram"

[[instance]]
driver = "sgp40"
name_ext = ""
bus = "i2c1"

[instance.wiring]
fram_target = "fram"

[instance.wiring.temperature_source]
source = "scd30"
field = "Temp"

[instance.wiring.humidity_source]
source = "scd30"
field = "Hum"

[[instance]]
driver = "bmp3xx"
name_ext = ""
bus = "i2c0"
address = 0x77

[instance.wiring]
fram_target = "fram"

# ISL29125: real dev-board wiring (i2c1, GPIO6 IRQ), bench-validated.
#
# irq_pull_up = false: the board carries its own external pull-up on GPIO6, so the driver's internal
# one stays off.
[[instance]]
driver = "isl29125"
name_ext = ""
bus = "i2c1"
irq_pin = 6
irq_pull_up = false

[instance.wiring]
fram_target = "fram"

# --- singleton services ------------------------------------------------------------------------

[[instance]]
driver = "fram"
bus = "spi0"
cs_pin = 5
# MB85RS2MTA, 256KB.
max_size = 0x40000

[[instance]]
driver = "neopixel"
pin = 18

[instance.wiring]
fram_target = "fram"

[[instance]]
driver = "notification"

[instance.wiring]
signal_sink = "neopixel"
fram_target = "fram"

# Per-signal getters - each optional; absence disables that specific warning signal.
[instance.wiring.warn_co2]
source = "scd30"
field = "CO2"

[instance.wiring.warn_voc]
source = "sgp40"
field = "VOC"

[instance.wiring.warn_hum]
source = "scd30"
field = "Hum"

# --- UART crossover link exerciser (bench-only) -------------------------------------------------
#
# Each end gets its own fram_target chunk, so a fault on one end stays attributable (WP3; only the
# link's own error history is made durable, Part J.1).
#
# Only dev has UART links: the crossover jumper they exercise is on the bench (owner, 2026-10-02).

[[instance]]
driver = "uart_link"
name_ext = "init"
bus = "uart0"
role = "initiator"

[instance.wiring]
fram_target = "fram"

[[instance]]
driver = "uart_link"
name_ext = "resp"
bus = "uart1"
role = "responder"

[instance.wiring]
fram_target = "fram"

# --- MQTT client (dev only, off until enabled over REST) -----------------------------------------
#
# dev only, off by default (owner, 2026-10-07: 'dev only, off (Recommended)'); its connection is paid
# for by max_connections above. Appended last, so every earlier FRAM chunk keeps its place.
[[instance]]
driver = "mqtt"

[instance.wiring]
fram_target = "fram"

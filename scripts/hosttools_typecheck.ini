# mypy config for a SEPARATE, host-tooling-scoped type-check pass covering every piece of
# CPython-target build tooling in the repo - buildgen/ (the device-TOML generator,
# BUILD_CHAIN_PLAN.md's Session 3), scripts/ and toolchain/ (the dev-tooling/build-environment
# scripts), and tests_scripts/ (their pytest suite). Run by scripts/typecheck.sh in addition to the
# main root pyproject.toml [tool.mypy] pass and digital_twin/'s own dedicated pass.
#
# Not folded into the main pass: unlike src/tests/digital_twin (real MicroPython-target code,
# checked against typings/'s MicroPython-stub-replaced typeshed - see pyproject.toml's [tool.mypy]
# custom_typeshed_dir comment), everything here is genuinely CPython-target host tooling (parses
# TOML via the real stdlib tomllib, walks driver source via the real stdlib ast, shells out via
# subprocess). Pointing it at the MicroPython-stub-replaced typeshed instead of mypy's real bundled
# one would break resolution of ordinary CPython 3.11+ stdlib names (tomllib didn't exist before
# 3.11, and isn't part of the MicroPython stub subset at all) - the same reasoning pyproject.toml's
# own [tool.mypy] comment gives for why typings/ can't share a venv with mypy/ruff/pytest's own
# dependencies, applied here to host tooling's own real stdlib usage instead. Unlike
# digital_twin/typecheck.ini, this pass needs no custom_typeshed_dir override at all - plain mypy
# defaults already resolve everything these directories import correctly.
#
# mypy_path covers the two import styles this scope actually uses: the repo root so
# tests_scripts/'s `import buildgen` resolves (its conftest.py does the same at runtime, since
# pytest only ever puts tests_scripts/ itself on sys.path), and tests_scripts/ so its own
# sibling-module imports (`from _toml_fixtures import base_doc`) resolve the same way pytest
# resolves them.
[mypy]
mypy_path = .:tests_scripts
platform = linux
python_version = 3.11
show_error_context = True
show_column_numbers = True
pretty = True

# Same strictness as the root [tool.mypy] section - kept in sync by hand since mypy has no
# "extends"/"include" directive for pulling shared settings from another config file.
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_return_any = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True
strict_equality = True

# scripts/_render_coverage.py is a self-contained PEP 723 `uv run` script - coverage.py is declared
# in its own inline dependency block and installed by uv at run time, never into the dev venv this
# pass runs from (see SPECIFICATION.md Part E.5's two-stage coverage pipeline).
[mypy-coverage.*]
ignore_missing_imports = True

# mypy config for a SEPARATE, buildgen-scoped type-check pass (BUILD_CHAIN_PLAN.md's Session 3 -
# "Build/generator script quality bar" #10), run by scripts/typecheck.sh in addition to the main
# root pyproject.toml [tool.mypy] pass and digital_twin/'s own dedicated pass. Not folded into the
# main pass: unlike src/tests/digital_twin (real MicroPython-target code, checked against
# typings/'s MicroPython-stub-replaced typeshed - see pyproject.toml's [tool.mypy]
# custom_typeshed_dir comment), buildgen/ is genuinely CPython-target host tooling (parses TOML via
# the real stdlib tomllib, walks driver source via the real stdlib ast - the same "host-only build
# tooling" category tests_scripts/ already occupies, CLAUDE.md's "Code quality tooling" section).
# Pointing it at the MicroPython-stub-replaced typeshed instead of mypy's real bundled one would
# break resolution of ordinary CPython 3.11+ stdlib names (tomllib didn't exist before 3.11, and
# isn't part of the MicroPython stub subset at all) - the same reasoning pyproject.toml's own
# [tool.mypy] comment gives for why typings/ can't share a venv with mypy/ruff/pytest's own
# dependencies, applied here to buildgen/'s own real stdlib usage instead. Unlike
# digital_twin/typecheck.ini, this pass needs no mypy_path/custom_typeshed_dir override at all -
# plain mypy defaults already resolve everything buildgen/ imports correctly.
[mypy]
platform = linux
python_version = 3.11
show_error_context = True
show_column_numbers = True
pretty = True

# Same strictness as the root [tool.mypy] section - kept in sync by hand since mypy has no
# "extends"/"include" directive for pulling shared settings from another config file.
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_return_any = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True
strict_equality = True
